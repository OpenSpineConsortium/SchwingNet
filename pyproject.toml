# Package metadata and tool configuration. The environment is pixi's (pixi.toml, pixi.lock); this
# file tells the tools where the code is and how strict to be. The package is imported from src/
# through PYTHONPATH (pixi.toml's activation), so no build backend is needed yet.

[project]
name = "schwingnet"
version = "0.0.0"
description = "SchwingNet: the retraining, measurement and demo of the level-naming network, under beethoven-qa's gate"
requires-python = ">=3.11"
dependencies = [
  "icontract>=2.6",
  "pydantic>=2",
  "beartype>=0.18",
]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor/beethoven-qa/src"]
# The gated tests only. The template's own tests under tests/ run with unittest from
# scripts/check.sh and skip what a copy cannot run, and the gate refuses a skipped test in the
# directories named here, so the two sets of tests keep their own directories.
testpaths = ["tests/schwingnet"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests/schwingnet"]
# A bare `ruff check --fix .` or `ruff format .` must never rewrite the pinned copy or the
# template's tools.
extend-exclude = ["vendor", "tools", "tests/*.py", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Contract lambdas take positional names that must match the function's arguments.
ignore = ["E731"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src:vendor/beethoven-qa/src"
packages = ["schwingnet"]
strict = true
warn_unused_ignores = true

# What `python -m beethoven_qa gate` checks in this repository (beethoven-qa docs/CONSUMING.md).
# The package holds the study's pure logic; what reads a corpus, runs torch or starts a Slurm job
# is listed below with its reason when it arrives, and the trainers of the reported stack stay in
# spinesurg-ct-nnunet, called by path, never refactored before the talk (docs/project.md).
[tool.beethoven-qa]
package = "schwingnet"
src = "src"
per_condition_timeout = 20

# Functions the gate never checks as targets, each with its reason; the gate prints the list on
# every run. A new entry is a person's decision in a reviewed change, never a way to get green,
# and every contracted function that calls a listed one is listed too, since CrossHair runs a
# listed function's body when it proves its caller. The two below take a pydantic model, which
# CrossHair 0.0.111 does not construct (beethoven-qa's Measured, 2026-10-04), so their
# preconditions can be met by no input it builds; tests/schwingnet/test_flow.py checks their
# contracts at run time, and nothing contracted calls them.
[tool.beethoven-qa.unproven]
"schwingnet.flow.result_line" = "takes a ResultRow, a pydantic model CrossHair cannot construct; its contracts are checked by the tests"
"schwingnet.slurm.sbatch_script" = "takes a JobSpec, a pydantic model CrossHair cannot construct; its contracts are checked by the tests"
"schwingnet.flow.configured_run_id" = "takes three 64-character digests, whose length and ASCII preconditions CrossHair 0.0.111 meets in only some runs within the gate's 20 s per condition (two runs of three with a commit in place of the first, none of three on the lengths alone, 2026-10-25; the gate failed on c290132 for it), and no weaker form keeps the lengths; tests/schwingnet/test_flow.py checks its contracts at run time"
"schwingnet.leaks.phash" = "takes a square grey reduction of 64 bytes or more, which CrossHair 0.0.111 does not build within the per-condition bound (the gate measured it unable to meet the precondition, 2026-10-21); tests/schwingnet/test_leaks.py checks its contracts at run time, and nothing contracted calls it"
"schwingnet.render_blocks.plan_crops" = "its postcondition checks that the crops cover every slice of a volume of up to 100,000, a set CrossHair 0.0.111 cannot build within the per-condition bound (the gate on 080e175 reported the precondition as one it could not meet, 2026-10-25); tests/schwingnet/test_render_blocks.py checks its contracts at run time, and tests/test_flexray_render.py holds it equal to FleXray's own plan_z_crops"
"schwingnet.realism.lora_config" = "its precondition asks for a plan that holds, whose base is a key of MODELS and whose target one of LORA_TARGETS, strings CrossHair 0.0.111 does not pick within the per-condition bound (the gate reported the precondition as one it could not meet, 2026-10-26); tests/schwingnet/test_realism.py checks its contracts at run time, and nothing contracted calls it"
"schwingnet.realism.replication_word" = "its precondition asks that both words be among the four verdict words, strings CrossHair 0.0.111 does not pick within the per-condition bound (the pre-push gate on 6ea43f5 reported the precondition as one it could not meet, 2026-10-29); tests/schwingnet/test_realism.py runs its contracts over every pair of the four words and refuses any other"
"schwingnet.autoanatomist_screen.plan_of" = "its precondition asks for a plan record that holds, a dict of the keys plan_problems checks (rows each with its person and part, arms with their words, seeds, a split and the counts), which CrossHair 0.0.111 does not build within the per-condition bound (the gate reported the precondition as one it could not meet, 2026-10-30); tests/schwingnet/test_autoanatomist_screen.py checks its contracts at run time over a plan that holds, every fault a plan can hold and the committed plans"
"schwingnet.autoanatomist_screen.rows_problems" = "its precondition asks for a plan record that holds, as plan_of's does (listed above), which CrossHair 0.0.111 does not build within the per-condition bound (the gate reported the precondition as one it could not meet, 2026-10-30); tests/schwingnet/test_autoanatomist_screen.py checks its contracts at run time over rows off the frozen split and on the test list, and the plan check runs it over the committed plans"
"schwingnet.autoanatomist_search.plan_of" = "its precondition asks for a plan that holds, a dict of the fourteen keys plan_problems checks (rows, a split, a space, seeds and a controller each in their own form), which CrossHair 0.0.111 does not build within the per-condition bound (the gate reported the precondition as one it could not meet, 2026-10-29); tests/schwingnet/test_autoanatomist_search.py checks its contracts at run time over a plan that holds and every fault, and nothing contracted calls it"
"schwingnet.autoanatomist_search.new_ledger" = "its precondition asks for a Plan whose name is an id and a manifest of rows each in one of the three parts, and its postcondition for a ledger ledger_problems finds nothing wrong with, which CrossHair 0.0.111 does not meet within the per-condition bound (the gate reported the precondition as one it could not meet, 2026-10-29); tests/schwingnet/test_autoanatomist_search.py checks its contracts at run time, and nothing contracted calls it"
"schwingnet.autoanatomist_search.last_rewards" = "takes the ledger's trials as a Mapping[str, object], and CrossHair 0.0.111, choosing a type for one of the objects, took the module's TypedDict Trial and then failed inside its own code while writing out the arguments of a path it meant to report (crosshair.dynamic_typing.unify asks a typing alias for __annotations__, AttributeError), in two runs of the gate over the module and one over the function alone (2026-10-29); tests/schwingnet/test_autoanatomist_search.py checks its contracts at run time over trials with a rung scored, with none scored and with no record, and summary_lines, the one contracted function that calls it, is listed below for it"
"schwingnet.autoanatomist_search.summary_lines" = "calls last_rewards, listed above, whose body CrossHair would run while proving this one; tests/schwingnet/test_autoanatomist_search.py checks its contracts at run time over a ledger that holds, one that does not and one with no trials"

# Findings of the interface standard's rule 1, a sealed tree, that this repository lets stand: the
# file, what matched there and the reason. The boundary check prints each on every run and fails on
# one that matches nothing any more, so the list only shrinks; a new entry is a person's decision in
# a reviewed change, as an unproven one is.
[tool.beethoven-qa.boundary]
".github/workflows/synthesis.yml" = { "${{ github.repository_owner }}/symphony-template" = "the synthesis of the artifacts (artifacts/_synthesis/) reads symphony-template's artifacts/, where the Symphony and Beethoven artifacts are kept, so that a change there is checked as one here is; the checkout is read-only, made with an App token scoped to that repository's contents, and this tree keeps of it only the synthesis's records of those artifacts, as it keeps of its own (the owner's choice of 2026-10-23, #166)" }
