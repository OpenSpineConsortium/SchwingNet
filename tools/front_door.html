<title>SchwingNet Front Door</title>
<meta name="claude:viewport-fit-sides" content="cover">

}

<script>
// The front door of the SchwingNet repository (tools/front_door.html). It holds no file of the
// repository: opened on claude.ai, it reads OpenSpineConsortium/SchwingNet itself, live and as the
// viewer, through the viewer's own GitHub connector (the artifact runtime's mcp capability, with
// the connector's read-only tools get_file_contents, list_commits and search_code), so a file or an
// artifact merged a minute ago is there at the next open, with nothing staged, copied or published
// again. Markdown is rendered here; a page of HTML, an exported artifact or a figure, is shown
// sealed in a frame without this page's origin, its stylesheets, scripts and images put inline and
// its fetches of files beside it answered by message, so its scripts reach neither this page nor
// the connector; an image is shown as it is. Ask puts the repository's files in Claude's hands
// through the runtime's sample capability, with tools that read through the same connector.
(function () {
  "use strict";
  var SERVER = "GitHub", OWNER = "OpenSpineConsortium", REPO = "SchwingNet", MAIN = "main";
  var GITHUB = "https://github.com/" + OWNER + "/" + REPO;
  var SEALED = "allow-scripts";   // scripts and nothing else: no popup, no navigation, no origin, so nothing leaves the frame
  var DOORS = [["Textbook", "docs/textbook", MAIN], ["Research", "docs/research/README.md", MAIN],
               ["Artifacts", "artifacts/README.md", MAIN], ["Board", "STATE.md", "board"],
               ["Memory", "docs/memory/MEMORY.md", MAIN], ["Checkpoints", "docs/checkpoints", MAIN],
               ["Data", "data", MAIN], ["Grid", "grid", MAIN]];
  var ELSEWHERE = /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i;
  var CSS_URL = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
  var MEDIA = [["img", "src"], ["source", "src"], ["video", "src"], ["video", "poster"], ["audio", "src"],
               ["input", "src"], ["track", "src"]];
  var TYPES = {html: "text/html", htm: "text/html", md: "text/markdown", css: "text/css", js: "text/javascript",
               mjs: "text/javascript", json: "application/json", ipynb: "application/json", svg: "image/svg+xml",
               png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp",
               ico: "image/x-icon", pdf: "application/pdf", txt: "text/plain", csv: "text/csv", tsv: "text/tab-separated-values",
               py: "text/x-python", sh: "text/x-shellscript", bash: "text/x-shellscript", yml: "text/yaml", yaml: "text/yaml",
               toml: "text/plain", xml: "text/xml", woff: "font/woff", woff2: "font/woff2", ttf: "font/ttf", otf: "font/otf"};
  var BINARY = /\.(?:png|jpe?g|gif|webp|ico|pdf|zip|gz|tgz|whl|sqlite|bin|pt|pth|onnx|npy|npz|woff2?|ttf|otf|docx|pptx|xlsx|mp4|webm|mp3|wav)$/i;
  var IMAGE = /\.(?:png|jpe?g|gif|webp|svg|ico)$/i;
  var MOST_TEXT = 1500000;   // the characters of a text file shown as text; a longer one is cut and said so
  var $ = function (id) { return document.getElementById(id); };
  var view = $("view"), content = $("content"), note = $("note"), busy = $("busy"), where = $("where"), side = $("side");

  var mcp = null;        // the mcp capability, once the viewer has it
  var reads = {};        // ref + path -> the promise of the file: {text, bytes, type}
  var folders = {};      // ref + path -> the promise of a folder's entries
  var blobs = [];        // the object URLs made for pictures, let go when the view changes
  var shown = null;      // the target in view: {kind, ref, path, hash, q}
  var opening = null;    // the open under way, so a slower earlier one never replaces it
  var trail = [];        // the targets before this one, for Back
  var watch = null;      // the observer that fills a document's pictures as they come near
  var sealed = null;     // {frame, ref, path} of the sealed page in view, whose messages are answered

  function code(e) { return (e && (e.code || e.name)) || "error"; }
  function wait(ms) { return new Promise(function (done) { setTimeout(done, ms); }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]; }); }
  function text(bytes) { return new TextDecoder().decode(bytes); }
  function key(ref, path) { return ref + "\n" + path; }
  function ext(path) { var m = /\.([A-Za-z0-9]+)$/.exec(path); return m ? m[1].toLowerCase() : ""; }
  function typeOf(path) { return TYPES[ext(path)] || "application/octet-stream"; }
  function parent(path) { return path.indexOf("/") < 0 ? "" : path.slice(0, path.lastIndexOf("/")); }
  function name(path) { return path.split("/").pop(); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "onclick") e.addEventListener("click", attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  // What the viewer reads where nothing is in view, or where something could not be read.
  function say(words, more, actions) {
    $("note-text").textContent = words;
    $("note-more").hidden = !more;
    $("note-more").innerHTML = more || "";
    var row = $("note-do");
    row.textContent = "";
    (actions || []).forEach(function (a) { row.appendChild(el("button", {type: "button", text: a[0], onclick: a[1]})); });
    note.hidden = false;
  }

  // The connector

  // A call to the viewer's GitHub connector, made again after the wait the runtime gives with
  // rate_limited, and once more for a passing failure the runtime marks retryable, never in a loop.
  function call(tool, input, tries) {
    tries = tries || 0;
    return mcp.callTool(SERVER, tool, input).catch(function (e) {
      var c = code(e);
      if (c === "rate_limited" && tries < 4) return wait((e && e.retryAfterMs) || 2000).then(function () { return call(tool, input, tries + 1); });
      if (e && e.retryable && c !== "rate_limited" && tries < 1) return wait(1500).then(function () { return call(tool, input, tries + 1); });
      throw e;
    });
  }

  // The JSON a tool answers with: the runtime's payload, else the first text block parsed.
  function payloadOf(r) {
    if (r && r.payload !== undefined) return r.payload;
    var blocks = r && Array.isArray(r.content) ? r.content : [];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i] && typeof blocks[i].text === "string") {
        try { return JSON.parse(blocks[i].text); } catch (e) { return blocks[i].text; }
      }
    }
    return r;
  }

  function fromBase64(b64) { return Uint8Array.from(atob(String(b64).replace(/\s+/g, "")), function (c) { return c.charCodeAt(0); }); }
  function toBase64(bytes) {
    var chunks = [];
    for (var i = 0; i < bytes.length; i += 0x8000) chunks.push(String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)));
    return btoa(chunks.join(""));
  }

  // A file out of what the connector hands back for get_file_contents: the GitHub server answers
  // with a resource block, the file's text or its bytes as base64, beside a text block that says it
  // was downloaded; a payload with content and encoding is the API's own envelope.
  function fileOf(r, path) {
    var blocks = r && Array.isArray(r.content) ? r.content : [], f = {type: typeOf(path), text: null, bytes: null};
    for (var i = 0; i < blocks.length; i++) {
      var res = blocks[i] && blocks[i].resource;
      if (res && typeof res.text === "string") { f.text = res.text; return f; }
      if (res && typeof res.blob === "string") { f.bytes = fromBase64(res.blob); return f; }
    }
    var p = r && r.payload;
    if (p && typeof p === "object" && typeof p.content === "string") {
      if (p.encoding === "base64") f.bytes = fromBase64(p.content);
      else f.text = p.content;
      return f;
    }
    if (typeof p === "string" && !/^successfully downloaded/i.test(p)) { f.text = p; return f; }
    throw {code: "unreadable", message: "the connector answered with no file"};
  }

  function notFound(e) { return /\b404\b|not found|does not exist/i.test(String((e && e.message) || "")); }

  function refOf(ref) { return "refs/heads/" + ref; }

  // A file's text or bytes, read once per open of this page; a path GitHub has not is not_found.
  function read(ref, path) {
    var k = key(ref, path);
    if (!reads[k]) {
      reads[k] = call("get_file_contents", {owner: OWNER, repo: REPO, path: path, ref: refOf(ref)}).then(function (r) {
        if (Array.isArray(payloadOf(r))) throw {code: "is_folder"};
        return fileOf(r, path);
      }).catch(function (e) {
        delete reads[k];
        if (code(e) === "tool_error" && notFound(e)) throw {code: "not_found", message: path};
        throw e;
      });
    }
    return reads[k];
  }
  function textOf(f) { return f.text !== null ? f.text : text(f.bytes); }
  function bytesOf(f) { return f.bytes !== null ? f.bytes : new TextEncoder().encode(f.text); }

  // A folder's entries, files and folders, read once per open of this page.
  function folder(ref, path) {
    var k = key(ref, path);
    if (!folders[k]) {
      folders[k] = call("get_file_contents", {owner: OWNER, repo: REPO, path: path || "/", ref: refOf(ref),
                                              fields: ["type", "name", "path", "size", "html_url"]}).then(function (r) {
        var p = payloadOf(r);
        if (!Array.isArray(p)) throw {code: "is_file"};
        return p.map(function (en) {
          return {type: en.type === "dir" ? "dir" : "file", name: String(en.name), size: en.size,
                  path: String(en.path).replace(/^\/+/, ""), url: en.html_url};
        }).sort(function (a, b) { return a.type !== b.type ? (a.type === "dir" ? -1 : 1) : a.name.localeCompare(b.name); });
      }).catch(function (e) {
        delete folders[k];
        if (code(e) === "tool_error" && notFound(e)) throw {code: "not_found", message: path};
        throw e;
      });
    }
    return folders[k];
  }

  // What a path is, by its folder's listing: a file, a folder, or nothing.
  function entryOf(ref, path) {
    if (!path) return Promise.resolve({type: "dir", name: "", path: "", size: 0});
    return folder(ref, parent(path)).then(function (entries) {
      for (var i = 0; i < entries.length; i++) if (entries[i].path === path) return entries[i];
      return null;
    }, function (e) { if (code(e) === "not_found") return null; throw e; });
  }

  // A file a page or a stylesheet refers to, read where its folder lists it, null otherwise, so a
  // reference to nothing costs no read; a folder that cannot be listed leaves the file out.
  function loadIfKnown(ref, path) {
    return entryOf(ref, path).then(function (en) {
      return en && en.type === "file" ? read(ref, path).catch(function () { return null; }) : null;
    }, function () { return null; });
  }

  // References

  // A reference a page makes, resolved against the page's own path; one that names another site,
  // a data or blob address or a place in the same page is none of the repository's. A link into
  // this repository on GitHub, by blob, raw or tree, is the file it names.
  function decode(s) { try { return decodeURIComponent(s); } catch (e) { return String(s); } }
  function resolve(base, ref) {
    ref = String(ref == null ? "" : ref).trim();
    var m = new RegExp("^" + GITHUB.replace(/[.]/g, "\\.") + "/(?:blob|raw|tree)/([^/#?]+)/([^#?]*)").exec(ref);
    if (m) return {ref: decode(m[1]), path: decode(m[2]).replace(/\/+$/, "")};
    if (!ref || ELSEWHERE.test(ref) || ref.charAt(0) === "#" || ref.charAt(0) === "?") return null;
    ref = ref.split("#")[0].split("?")[0];
    var parts = ref.charAt(0) === "/" ? [] : String(base).split("/").slice(0, -1);
    ref.split("/").forEach(function (step) {
      if (step === "..") parts.pop();
      else if (step && step !== ".") parts.push(decode(step));
    });
    return {ref: null, path: parts.join("/")};
  }
  function fragment(ref) { var at = String(ref).indexOf("#"); return at < 0 ? "" : String(ref).slice(at + 1); }
  function slug(s) {
    return String(s).toLowerCase().replace(/<[^>]*>/g, "").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-");
  }

  // Markdown, as the repository's documents write it: headings, paragraphs, lists, fenced code,
  // quotes, rules and tables, with code spans, emphasis, links, images and bare addresses inline.
  // Raw HTML is shown as text, never run. A relative link or image names a file of the repository.
  function markdown(src) {
    var lines = String(src).replace(/\r\n?/g, "\n").split("\n"), out = [], i = 0, m;
    function blockStart(l) {
      return /^\s*$/.test(l) || /^(?:`{3,}|~{3,})/.test(l) || /^#{1,6}\s/.test(l) || /^ {0,3}>/.test(l) ||
             /^ {0,3}([-*_])(\s*\1){2,}\s*$/.test(l) || /^\s*([-*+]|\d+[.)])\s+/.test(l) || /^\s*\|/.test(l) || /^\s*<!--/.test(l);
    }
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }
      if ((m = /^\s*(`{3,}|~{3,})\s*([^`\s]*)/.exec(line))) {
        var fence = m[1], lang = m[2], buf = [];
        i++;
        while (i < lines.length && !(lines[i].trim().slice(0, fence.length) === fence && /^\s*$/.test(lines[i].trim().slice(fence.length)))) buf.push(lines[i++]);
        i++;
        out.push("<pre><code" + (lang ? " class=\"lang-" + esc(lang) + "\"" : "") + ">" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }
      if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line))) {
        out.push("<h" + m[1].length + " id=\"doc-" + esc(slug(m[2])) + "\">" + inline(m[2]) + "</h" + m[1].length + ">");
        i++;
        continue;
      }
      if (/^ {0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
      if (/^\s*<!--/.test(line)) {
        while (i < lines.length && lines[i].indexOf("-->") < 0) i++;
        i++;
        continue;
      }

      clear();
      crumbs(ref, path);
      content.appendChild(el("img", {"class": "picture", src: pictureUrl(f), alt: name(path)}));
      note.hidden = true;
    });
    if (BINARY.test(path)) {
      clear();
      crumbs(ref, path);
      content.appendChild(el("p", {text: name(path) + " is a binary file" + (en && typeof en.size === "number" ? " of " + size(en.size) : "") + "."}));
      if (en && en.url) content.appendChild(el("p", {}, [el("a", {href: en.url, target: "_blank", rel: "noopener", text: "Open it on GitHub"})]));
      note.hidden = true;
      return Promise.resolve();
    }
    return read(ref, path).then(function (f) {
      clear();
      crumbs(ref, path);
      var t = textOf(f);
      if (e === "md") {
        content.appendChild(docOf(ref, path, t));
        if (shownHash()) setTimeout(function () { reveal(shownHash()); }, 0);
      } else {
        var cut = t.length > MOST_TEXT;
        content.appendChild(el("pre", {}, [el("code", {text: cut ? t.slice(0, MOST_TEXT) : t})]));
        if (cut) content.appendChild(el("p", {"class": "muted", text: "Cut after " + MOST_TEXT.toLocaleString() + " characters; the whole file is on GitHub."}));
      }
      note.hidden = true;
    });
  }
  function shownHash() { return (shown && shown.hash) || ""; }

  function showSealed(ref, path, hash) {
    return sealedDoc(ref, path, hash, 0).then(function (html) {
      clear();
      crumbs(ref, path);
      view.className = "framed";
      var frame = el("iframe", {title: name(path), sandbox: SEALED});
      frame.setAttribute("srcdoc", html);
      content.appendChild(frame);
      sealed = {frame: frame, ref: ref, path: path};
      note.hidden = true;
    });
  }

  function showChanges() {
    return call("list_commits", {owner: OWNER, repo: REPO, sha: MAIN, perPage: 30, fields: ["sha", "html_url", "commit", "author"]}).then(function (r) {
      var commits = payloadOf(r);
      if (!Array.isArray(commits)) throw {code: "unreadable"};
      clear();
      where.textContent = "The newest commits of main";
      var ul = el("ul", {"class": "commits"});
      commits.forEach(function (c) {
        var m = (c.commit && c.commit.message) || "", when = c.commit && c.commit.committer && c.commit.committer.date;
        var who = (c.author && c.author.login) || (c.commit && c.commit.author && c.commit.author.name) || "";
        ul.appendChild(el("li", {}, [
          el("a", {"class": "sha", href: c.html_url || GITHUB + "/commit/" + c.sha, target: "_blank", rel: "noopener", text: String(c.sha || "").slice(0, 7)}),
          el("span", {text: String(m).split("\n")[0]}),
          el("span", {"class": "when", text: (when ? String(when).slice(0, 16).replace("T", " ") + " UTC" : "") + (who ? ", " + who : "")})]));
      });
      content.appendChild(ul);
      note.hidden = true;
    });
  }

  function showSearch(q) {
    return call("search_code", {query: "repo:" + OWNER + "/" + REPO + " " + q, perPage: 30}).then(function (r) {
      var p = payloadOf(r), items = p && Array.isArray(p.items) ? p.items : [];
      clear();
      where.textContent = "Search: " + q;
      if (!items.length) { content.appendChild(el("p", {"class": "muted", text: "Nothing in the repository's default branch matches, as GitHub indexes it."})); note.hidden = true; return; }
      var ul = el("ul", {"class": "hits"});
      items.forEach(function (it) {
        var li = el("li", {}, [el("button", {type: "button", "class": "plain", text: it.path, onclick: function () { open({kind: "path", ref: MAIN, path: it.path}); }})]);
        (it.text_matches || []).slice(0, 3).forEach(function (tm) { if (tm && tm.fragment) li.appendChild(el("pre", {text: tm.fragment})); });
        ul.appendChild(li);
      });
      content.appendChild(ul);
      note.hidden = true;
    });
  }

  // Ask: a question answered by Claude, as the viewer, with tools that read the repository
  // through the viewer's connector, so the answer can name the files it read.
  var asking = null;
  function showAsk() {
    clear();
    where.textContent = "Ask about the repository";
    var box = el("div", {id: "ask"});
    box.appendChild(el("p", {"class": "muted", text: "Claude answers from the files it reads through your GitHub connector, and names them."}));
    var q = el("textarea", {id: "question", placeholder: "What do you want to know?"});
    var go = el("button", {type: "button", id: "ask-go", text: "Ask"});
    var stop = el("button", {type: "button", id: "ask-stop", text: "Stop"});
    stop.hidden = true;
    var answer = el("div", {id: "answer"});
    box.appendChild(q);
    box.appendChild(el("div", {"class": "row"}, [go, stop]));
    box.appendChild(answer);
    content.appendChild(box);
    note.hidden = true;
    go.addEventListener("click", function () { ask(q.value.trim(), answer, go, stop); });
    stop.addEventListener("click", function () { if (asking) asking.abort(); });
    return Promise.resolve();
  }
  function tools() {
    return [
      {name: "list_folder", description: "The files and folders in a folder of the repository, at main.",
       inputSchema: {type: "object", properties: {path: {type: "string", description: "The folder's path, empty for the top"}}},
       execute: function (input) { return folder(MAIN, String((input && input.path) || "").replace(/^\/+|\/+$/g, "")).then(function (es) {
         return es.map(function (en) { return en.type === "dir" ? en.path + "/" : en.path; }); }); }},
      {name: "read_file", description: "The text of a file of the repository, at main, up to 60000 characters.",
       inputSchema: {type: "object", properties: {path: {type: "string"}}, required: ["path"]},
       execute: function (input) { return read(MAIN, String(input.path).replace(/^\/+/, "")).then(function (f) {
         var t = textOf(f); return t.length > 60000 ? t.slice(0, 60000) + "\n[cut]" : t; }); }},
      {name: "search", description: "GitHub code search over the repository's default branch; returns matching paths.",
       inputSchema: {type: "object", properties: {query: {type: "string"}}, required: ["query"]},
       execute: function (input) { return call("search_code", {query: "repo:" + OWNER + "/" + REPO + " " + String(input.query), perPage: 20}).then(function (r) {
         var p = payloadOf(r); return (p && p.items ? p.items : []).map(function (it) { return it.path; }); }); }}
    ];
  }
  function ask(question, out, go, stop) {
    if (!question) return;
    out.textContent = "Thinking...";
    go.disabled = true;
    stop.hidden = false;
    asking = new AbortController();
    var prompt = "You answer questions about the GitHub repository " + OWNER + "/" + REPO + ", a confidential research repository, " +
      "for a member of it. Use the tools to list folders, read files and search before you answer; start from README.md, " +
      "docs/project.md, docs/memory/MEMORY.md and docs/research/README.md where the question gives no path. Answer in plain " +
      "prose, name every file you drew on by its path, and say what you could not find. Question: " + question;
    window.claude.use("sample").then(function (fn) {
      if (!fn) throw {code: "absent"};
      return fn(prompt, {tools: tools(), signal: asking.signal, cache: false, onText: function (u) { out.textContent = u.text; }});
    }).then(function (r) { out.textContent = r.text; }, function (e) {
      var c = code(e);
      out.textContent = c === "cancelled" ? ((e && e.text) || "") + "\n[stopped]" : c === "absent" ? "Ask is not available in this view." :
        c === "not_granted" ? "You chose not to let this page ask Claude; the artifact's Permissions menu turns it on." :
        "The question could not be answered (" + c + ")." + ((e && e.text) ? "\n" + e.text : "");
    }).then(function () { go.disabled = false; stop.hidden = true; asking = null; });
  }

  // Opening a target

  function open(target, remember) {
    var me = {}, was = shown;
    opening = me;
    busy.hidden = false;
    var shows;
    if (target.kind === "changes") shows = showChanges();
    else if (target.kind === "search") shows = showSearch(target.q);
    else if (target.kind === "ask") shows = showAsk();
    else {
      target.ref = target.ref || MAIN;
      target.path = String(target.path || "").replace(/^\/+|\/+$/g, "");
      shows = entryOf(target.ref, target.path).then(function (en) {
        if (opening !== me) return;
        if (!en) throw {code: "not_found", message: target.path};
        if (shown && shown.kind === "path" && shown.ref === target.ref && shown.path === target.path && en.type === "file") {
          shown.hash = target.hash || "";
          if (ext(target.path) === "md") { reveal(shown.hash); return "same"; }
        }
        if (en.type === "dir") return folder(target.ref, target.path).then(function (es) { return opening === me ? showFolder(target.ref, target.path, es) : null; });
        shown = target;   // the hash a file opens at is read from the target in view
        return showFile(target.ref, target.path, en).catch(function (e) { shown = was; throw e; });
      });
    }
    shows.then(function (r) {
      if (opening !== me || r === "same") return;
      if (remember !== false && was) trail.push(was);
      shown = target;
      $("back").disabled = !trail.length;
      side.classList.remove("open");
      $("files").setAttribute("aria-expanded", "false");
    }).catch(function (e) {
      if (opening === me) failed(e, target);
    }).then(function () { if (opening === me) busy.hidden = true; });
  }

  function connectSteps() {
    return "Claude's connector directory has no GitHub connector, so GitHub is added once as a custom connector in your own " +
      "claude.ai settings, with a GitHub App of yours that may read this repository:<ol>" +
      "<li>Open <a href=\"https://claude.ai/settings/connectors\" target=\"_blank\" rel=\"noopener\">claude.ai/settings/connectors</a> and choose Add custom connector.</li>" +
      "<li>Name it exactly <code>GitHub</code>; the remote MCP server address is <code>https://api.githubcopilot.com/mcp/</code>.</li>" +
      "<li>Under Advanced settings enter the client id and client secret of your GitHub App, whose callback URL is " +
      "<code>https://claude.ai/api/mcp/auth_callback</code>; Add, then Connect and sign in to GitHub.</li>" +
      "<li>Open this page again and allow it to use GitHub when asked.</li></ol>";
  }

  function stopped(e) {
    busy.hidden = true;
    var c = code(e);
    if (c === "absent") say("This view cannot reach your connectors.", "Open the door on claude.ai, signed in to the account that holds it.", []);
    else if (c === "needs_reauth")
      say("Your GitHub connector needs to be connected again.", "Reconnect GitHub in claude.ai Settings, Connectors, then try again.", [["Try again", start]]);
    else if (c === "selection_required")
      say("More than one of your connectors is named GitHub.", "Choose one when claude.ai asks, or keep one connector of that name in claude.ai Settings, Connectors, then try again.",
          [["Try again", start]]);
    else if (c === "server_not_connected" || c === "server_not_found")
      say("GitHub is not connected to your claude.ai account, so the door has nothing to show.", connectSteps(), [["Try again", start]]);
    else if (c === "not_granted" || c === "consent_required")
      say("The door may not use your GitHub connector, so it cannot read the repository.", "You chose not to allow it. The artifact's Permissions menu turns it back on.",
          [["Open permissions", permissions], ["Try again", start]]);
    else if (c === "not_in_manifest")
      say("The door may not call your GitHub connector's tools.",
          "If you turned GitHub off for this page, or declined it when the page first asked, the artifact's Permissions menu turns it on. " +
          "Otherwise the page's published capabilities are stale, and the door's loader, tools/front_door_loader.html, is published again with tools/textbook_publish.py.",
          [["Open permissions", permissions], ["Try again", start]]);
    else if (c === "blocked_by_policy")
      say("Your organization's policy blocks this tool for you, so the door cannot read the repository.", "", []);
    else say("The repository could not be read (" + esc(c) + ").", esc((e && e.message) || "This is usually a passing network or service problem."), [["Try again", start]]);
  }

  function failed(e, target) {
    var c = code(e);
    if (["absent", "not_granted", "consent_required", "server_not_connected", "server_not_found", "needs_reauth", "selection_required",
         "not_in_manifest", "blocked_by_policy", "capability_disabled", "capability_removed"].indexOf(c) >= 0) { stopped(e); return; }
    var close = ["Close", function () { note.hidden = Boolean(shown); }];
    if (c === "not_found") say("That is not in the repository.", esc((target.ref || MAIN) + ": " + (target.path || "")), [close]);
    else if (c === "tool_error") say("GitHub refused the read.", esc((e && e.message) || ""), [close, ["Try again", function () { open(target, false); }]]);
    else say("This could not be opened (" + esc(c) + ").", esc((e && e.message) || (target.path || "")), [close, ["Try again", function () { open(target, false); }]]);
  }

  function permissions() {
    window.claude.use("permissions").then(function (p) { return p ? p.manage() : null; }).then(start, function () {
      say("The Permissions panel did not open.", "Use the artifact's Permissions menu to let the door use your GitHub connector, then open it again.", [["Try again", start]]);
    });
  }

  function showHead() {
    return call("list_commits", {owner: OWNER, repo: REPO, sha: MAIN, perPage: 1, fields: ["sha", "commit"]}).then(function (r) {
      var c = payloadOf(r);
      c = Array.isArray(c) ? c[0] : null;
      if (!c) return;
      var when = c.commit && c.commit.committer && c.commit.committer.date;
      $("head").textContent = "main " + String(c.sha || "").slice(0, 7) + (when ? ", " + String(when).slice(0, 16).replace("T", " ") + " UTC" : "") +
        (c.commit && c.commit.message ? ": " + String(c.commit.message).split("\n")[0] : "");
    }, function () { /* the head line is a courtesy */ });
  }

  // The deep link: a path with its slashes written as ~, or one of the words board, changes, ask.
  function firstTarget() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) { h = ""; }
    if (!h) return {kind: "path", ref: MAIN, path: ""};
    if (h === "board") return {kind: "path", ref: "board", path: "STATE.md"};
    if (h === "changes" || h === "ask") return {kind: h};
    return {kind: "path", ref: MAIN, path: h.replace(/~/g, "/")};
  }

  $("back").addEventListener("click", function () {
    var t = trail.pop();
    $("back").disabled = !trail.length;
    if (t) open(t, false);
  });
  $("home").addEventListener("click", function () { open({kind: "path", ref: MAIN, path: ""}); });
  $("changes").addEventListener("click", function () { open({kind: "changes"}); });
  $("ask-open").addEventListener("click", function () { open({kind: "ask"}); });
  $("find").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = $("q").value.trim();
    if (q) open({kind: "search", q: q});
  });
  $("files").addEventListener("click", function () {
    var on = !side.classList.contains("open");
    side.classList.toggle("open", on);
    $("files").setAttribute("aria-expanded", String(on));
  });

  // The viewer's theme toggle reaches the sealed page in view.
  new MutationObserver(function () {
    if (!sealed) return;
    try {
      var root = sealed.frame.contentDocument.documentElement, theme = document.documentElement.getAttribute("data-theme");
      if (theme) root.setAttribute("data-theme", theme);
      else root.removeAttribute("data-theme");
    } catch (e) { /* a sealed frame of another origin is not reachable; it keeps the theme it opened with */ }
  }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

  function start() {
    reads = {};
    folders = {};
    trail = [];
    shown = null;
    clear();
    where.textContent = "";
    $("head").textContent = "";
    $("back").disabled = true;
    pane(MAIN, "", null);
    say("Opening the repository...", "", []);
    if (!window.claude || typeof window.claude.use !== "function") { stopped({code: "absent"}); return; }
    busy.hidden = false;
    window.claude.use("mcp").then(function (m) {
      if (!m) throw {code: "absent"};
      mcp = m;
      return mcp.listTools(SERVER);
    }).then(function () {
      showHead();
      open(firstTarget(), false);
    }).catch(stopped);
  }

  if (document.readyState === "complete") start();
  else window.addEventListener("load", start, {once: true});
})();
</script>
