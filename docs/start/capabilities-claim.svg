<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>A claim, from issue to merge, and the second push GitHub refuses</title>
  <rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <g fill="#f3efe6" stroke="#8a7a5c" stroke-width="1.5">
    <rect x="20" y="40" width="130" height="64" rx="8"/>
    <rect x="190" y="40" width="150" height="64" rx="8"/>
    <rect x="380" y="40" width="130" height="64" rx="8"/>
    <rect x="550" y="40" width="130" height="64" rx="8"/>
    <rect x="720" y="40" width="120" height="64" rx="8"/>
  </g>
  <g fill="#222222" text-anchor="middle">
    <text x="85" y="68" font-weight="bold">Issue #7</text>
    <text x="85" y="88" font-size="12">labelled todo</text>
    <text x="265" y="68" font-weight="bold">alice pushes</text>
    <text x="265" y="88" font-size="12">claude/7 + claim file</text>
    <text x="445" y="68" font-weight="bold">Draft PR</text>
    <text x="445" y="88" font-size="12">Closes #7</text>
    <text x="615" y="68" font-weight="bold">check green</text>
    <text x="615" y="88" font-size="12">scripts/check.sh</text>
    <text x="780" y="68" font-weight="bold">Merged</text>
    <text x="780" y="88" font-size="12">issue closes</text>
  </g>
  <g stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="72" x2="188" y2="72"/>
    <line x1="340" y1="72" x2="378" y2="72"/>
    <line x1="510" y1="72" x2="548" y2="72"/>
    <line x1="680" y1="72" x2="718" y2="72"/>
  </g>
  <rect x="190" y="180" width="150" height="64" rx="8" fill="#fbe9e7" stroke="#b5452f" stroke-width="1.5"/>
  <g fill="#222222" text-anchor="middle">
    <text x="265" y="208" font-weight="bold">bob pushes</text>
    <text x="265" y="228" font-size="12">claude/7, a moment later</text>
  </g>
  <line x1="265" y1="180" x2="265" y2="106" stroke="#b5452f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="275" y="150" fill="#b5452f" font-size="13">refused: the branch exists (fetch first)</text>
  <rect x="380" y="180" width="300" height="64" rx="8" fill="#eef4ea" stroke="#5b7f4a" stroke-width="1.5"/>
  <g fill="#222222" text-anchor="middle">
    <text x="530" y="208" font-weight="bold">bob takes the next issue in the Queue</text>
    <text x="530" y="228" font-size="12">the board shows #7 as alice's</text>
  </g>
  <line x1="340" y1="212" x2="378" y2="212" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="290" fill="#444444" font-size="13">The push guard stops a session's --force, a push to main and a lease onto another worker's claim before git runs;</text>
  <text x="20" y="310" fill="#444444" font-size="13">GitHub's own refusal of the second push is what makes the claim a lock. Run it: bash scripts/demo.sh race</text>
</svg>
