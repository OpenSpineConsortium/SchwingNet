<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Every kind of worker shares one repository, and GitHub Actions keeps the board</title>
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <g fill="#eaf0f7" stroke="#4a6a8f" stroke-width="1.5">
    <rect x="20" y="30" width="190" height="56" rx="8"/>
    <rect x="20" y="110" width="190" height="56" rx="8"/>
    <rect x="20" y="190" width="190" height="56" rx="8"/>
    <rect x="20" y="270" width="190" height="56" rx="8"/>
  </g>
  <g fill="#222222" text-anchor="middle">
    <text x="115" y="54" font-weight="bold">People's sessions</text>
    <text x="115" y="73" font-size="12">local, cloud, claude.ai Projects</text>
    <text x="115" y="134" font-weight="bold">Routines</text>
    <text x="115" y="153" font-size="12">on someone's own account</text>
    <text x="115" y="214" font-weight="bold">Workers in Actions</text>
    <text x="115" y="233" font-size="12">workers.yml, the token pool</text>
    <text x="115" y="294" font-weight="bold">@claude</text>
    <text x="115" y="313" font-size="12">claude.yml on an issue or PR</text>
  </g>
  <rect x="300" y="60" width="260" height="240" rx="10" fill="#f3efe6" stroke="#8a7a5c" stroke-width="2"/>
  <g fill="#222222" text-anchor="middle">
    <text x="430" y="88" font-weight="bold" font-size="16">One GitHub repository</text>
    <text x="430" y="118" font-size="13">Issues: the queue</text>
    <text x="430" y="142" font-size="13">claude/&lt;issue&gt; branches: the claims</text>
    <text x="430" y="166" font-size="13">Pull requests: the handoff</text>
    <text x="430" y="190" font-size="13">CLAUDE.md, docs/memory: what all read</text>
    <text x="430" y="214" font-size="13">The required check: the rules</text>
    <text x="430" y="238" font-size="13">Branch board, STATE.md: the board</text>
    <text x="430" y="272" font-size="12" fill="#555555">no server of ours, no API key</text>
  </g>
  <g stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)">
    <line x1="212" y1="58" x2="298" y2="120"/>
    <line x1="212" y1="138" x2="298" y2="160"/>
    <line x1="212" y1="218" x2="298" y2="200"/>
    <line x1="212" y1="298" x2="298" y2="240"/>
  </g>
  <g fill="#eef4ea" stroke="#5b7f4a" stroke-width="1.5">
    <rect x="650" y="40" width="190" height="70" rx="8"/>
    <rect x="650" y="145" width="190" height="70" rx="8"/>
    <rect x="650" y="250" width="190" height="70" rx="8"/>
  </g>
  <g fill="#222222" text-anchor="middle">
    <text x="745" y="66" font-weight="bold">board.yml</text>
    <text x="745" y="85" font-size="12">renders the board, releases</text>
    <text x="745" y="100" font-size="12">idle claims, tells overlaps</text>
    <text x="745" y="171" font-weight="bold">coordinator.yml</text>
    <text x="745" y="190" font-size="12">plans an epic into tasks</text>
    <text x="745" y="205" font-size="12">for registered workers</text>
    <text x="745" y="276" font-weight="bold">Control panel</text>
    <text x="745" y="295" font-size="12">openspineconsortium.com,</text>
    <text x="745" y="310" font-size="12">as the signed-in person</text>
  </g>
  <g stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)">
    <line x1="562" y1="120" x2="648" y2="80"/>
    <line x1="562" y1="180" x2="648" y2="180"/>
    <line x1="562" y1="240" x2="648" y2="282"/>
  </g>
  <text x="20" y="370" fill="#444444" font-size="13">Workers never talk to each other: each reads the board, claims by a push, and hands off by a pull request.</text>
</svg>
