<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 520' width='1000' height='520' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img'><title>SchwingNet as built</title><style>.ink{fill:#1b1b1a}.ink2{fill:#5c5b57}.stk{stroke:#1b1b1a}.stk2{stroke:#5c5b57}.learned{fill:#f2f1ed}.paper{fill:#ffffff}.head{fill:#1b1b1a}.rec{fill:#e4ecf7}@media (prefers-color-scheme: dark){.bg{fill:#151514}.ink{fill:#ecebe6}.ink2{fill:#b5b3ac}.stk{stroke:#ecebe6}.stk2{stroke:#b5b3ac}.learned{fill:#262624}.paper{fill:#1c1c1a}.head{fill:#ecebe6}.rec{fill:#1e2b40}}</style><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' class='head' fill='#1b1b1a'/></marker><marker id='dim' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2a5fa8'/></marker><marker id='prop' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#9a6f12'/></marker></defs><rect class='bg' width='1000' height='520' fill='#ffffff'/><text x='20.0' y='30.0' font-size='16' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>SchwingNet as built: the stages, and which of them learn</text><text x='20.0' y='50.0' font-size='11.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>The reported stack of chapter 12, one model per stage; version 1 inherits the separate stages. Read left to right.</text><rect x='20' y='90' width='110' height='190' rx='6' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3'/><polygon points='50.8,102.0 99.2,102.0 100.2,121.2 49.8,121.2' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='49.6,126.2 100.4,126.2 101.4,145.4 48.6,145.4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='48.4,150.4 101.6,150.4 102.6,169.6 47.4,169.6' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='47.2,174.6 102.8,174.6 103.8,193.8 46.2,193.8' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='46.0,198.8 104.0,198.8 105.0,218.0 45.0,218.0' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='40.8,223.0 109.2,223.0 79.0,249.6 71.0,249.6' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><text x='75.0' y='300.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a C-arm frame</text><rect x='160.0' y='100.0' width='170.0' height='150.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='245.0' y='118.0' font-size='12' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Body detector</text><text x='245.0' y='135.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>YOLO11m-pose: a box and</text><text x='245.0' y='149.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>four corner keypoints</text><text x='245.0' y='163.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>per body; a second</text><text x='245.0' y='177.9' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>detector finds the</text><text x='245.0' y='192.2' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>vertebra and the sacrum</text><text x='245.0' y='206.5' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>on real frames</text><line x1='130.0' y1='185.0' x2='158.0' y2='185.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='360.0' y='110.0' width='150.0' height='130.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='435.0' y='128.0' font-size='12' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Box repair</text><text x='435.0' y='145.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>fills at most two</text><text x='435.0' y='159.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>bodies per gap from</text><text x='435.0' y='173.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the spacing, never</text><text x='435.0' y='187.9' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>past the chain's ends</text><line x1='330.0' y1='175.0' x2='358.0' y2='175.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='560.0' y='70.0' width='200.0' height='120.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='660.0' y='88.0' font-size='12' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Level encoder and run head</text><text x='660.0' y='105.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>ResNet-18 over 27 classes, C1</text><text x='660.0' y='119.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>to C7, T1 to T13, L1 to L6</text><text x='660.0' y='133.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>and the sacrum; a</text><text x='660.0' y='147.9' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>bidirectional GRU reads runs</text><text x='660.0' y='162.2' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>of 2 to 9 bodies</text><rect x='560.0' y='215.0' width='200.0' height='100.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='660.0' y='233.0' font-size='12' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Count from the anchor</text><text x='660.0' y='250.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>each body the k-th from the</text><text x='660.0' y='264.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>sacrum or C2; reads</text><text x='660.0' y='278.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>positions, never a class</text><line x1='510.0' y1='160.0' x2='558.0' y2='130.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><line x1='510.0' y1='190.0' x2='558.0' y2='255.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='800.0' y='140.0' width='170.0' height='100.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='885.0' y='158.0' font-size='12' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Coupling</text><text x='885.0' y='175.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the count and the names</text><text x='885.0' y='189.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>joined into one answer</text><text x='885.0' y='203.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>per body</text><line x1='760.0' y1='130.0' x2='798.0' y2='175.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><line x1='760.0' y1='265.0' x2='798.0' y2='210.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><text x='885.0' y='262.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='italic'>named bodies on the overlay</text><text x='160.0' y='352.0' font-size='12' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='bold' font-style='normal'>In the white paper's two SchwingCheck pathways</text><line x1='245.0' y1='250.0' x2='245.0' y2='364.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='160.0' y='366.0' width='240.0' height='92.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='280.0' y='384.0' font-size='12' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>AP and lateral panoramas</text><text x='280.0' y='401.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>overlapping exposures linked from</text><text x='280.0' y='415.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the anchor into one map per plane</text><text x='280.0' y='429.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>(chapter 34)</text><line x1='400.0' y1='412.0' x2='438.0' y2='412.0' stroke='#9a6f12' stroke-width='1.4' stroke-dasharray='2 3' marker-end='url(#prop)'/><rect x='440.0' y='366.0' width='260.0' height='92.0' rx='4' stroke='#9a6f12' fill='#ffffff' class='paper' stroke-width='1.3' stroke-dasharray='2 3'/><text x='570.0' y='384.0' font-size='12' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>Five of the seven measures</text><text x='570.0' y='401.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the corners give both end-plate widths</text><text x='570.0' y='415.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>(AP) or depths (lateral) and the body's</text><text x='570.0' y='429.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>height; the canal needs landmarks no</text><text x='570.0' y='443.9' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>head finds yet (figures 36.4, 36.5)</text><line x1='700.0' y1='412.0' x2='738.0' y2='412.0' stroke='#9a6f12' stroke-width='1.4' stroke-dasharray='2 3' marker-end='url(#prop)'/><rect x='740.0' y='366.0' width='230.0' height='92.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='855.0' y='384.0' font-size='12' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>SchwingCheck</text><text x='855.0' y='401.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>names the run, or checks the run</text><text x='855.0' y='415.3' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>head's names, with a probability</text><text x='855.0' y='429.6' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>on each (figure 36.2)</text><rect x='20.0' y='478.0' width='26.0' height='16.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='54.0' y='490.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>learned from data</text><rect x='190.6' y='478.0' width='26.0' height='16.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='224.6' y='490.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a rule: learns nothing</text><rect x='392.5' y='478.0' width='26.0' height='16.0' rx='4' stroke='#9a6f12' fill='#ffffff' class='paper' stroke-width='1.3' stroke-dasharray='2 3'/><text x='426.5' y='490.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>proposed: not built, not timed</text><text x='20.0' y='510.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Source: chapter 12 and its artifacts (Reported). The corner detector, detect_v1, takes 6.8 ms per image on hardware its report does not name.</text></svg>
