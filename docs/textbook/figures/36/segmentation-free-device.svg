<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 760' width='1000' height='760' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img'><title>A segmentation-free measuring device</title><style>.ink{fill:#1b1b1a}.ink2{fill:#5c5b57}.stk{stroke:#1b1b1a}.stk2{stroke:#5c5b57}.learned{fill:#f2f1ed}.paper{fill:#ffffff}.head{fill:#1b1b1a}.rec{fill:#e4ecf7}@media (prefers-color-scheme: dark){.bg{fill:#151514}.ink{fill:#ecebe6}.ink2{fill:#b5b3ac}.stk{stroke:#ecebe6}.stk2{stroke:#b5b3ac}.learned{fill:#262624}.paper{fill:#1c1c1a}.head{fill:#ecebe6}.rec{fill:#1e2b40}}</style><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' class='head' fill='#1b1b1a'/></marker><marker id='dim' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2a5fa8'/></marker><marker id='prop' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#9a6f12'/></marker></defs><rect class='bg' width='1000' height='760' fill='#ffffff'/><text x='20.0' y='30.0' font-size='16' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>A measuring device with no segmentation: one landmark pass, then arithmetic</text><text x='20.0' y='50.0' font-size='11.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Proposed to keep latency low. Only the corner detector and the posterior exist and have been timed; everything ochre is to build.</text><rect x='20' y='80' width='70' height='120' rx='6' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3'/><polygon points='39.6,92.0 70.4,92.0 71.4,102.4 38.6,102.4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='38.4,107.4 71.6,107.4 72.6,117.8 37.4,117.8' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='37.2,122.8 72.8,122.8 73.8,133.2 36.2,133.2' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='36.0,138.2 74.0,138.2 75.0,148.5 35.0,148.5' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='30.8,153.5 79.2,153.5 59.0,170.5 51.0,170.5' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><rect x='100' y='80' width='70' height='120' rx='6' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3'/><polygon points='119.6,92.0 150.4,92.0 151.4,102.4 118.6,102.4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='118.4,107.4 151.6,107.4 152.6,117.8 117.4,117.8' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='117.2,122.8 152.8,122.8 153.8,133.2 116.2,133.2' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><polygon points='116.0,138.2 154.0,138.2 155.0,148.5 115.0,148.5' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.2'/><text x='95.0' y='220.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>AP and lateral frames</text><text x='95.0' y='234.0' font-size='11' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>or panoramas</text><rect x='190.0' y='80.0' width='160.0' height='120.0' rx='4' stroke='#9a6f12' fill='#ffffff' class='paper' stroke-width='1.3' stroke-dasharray='2 3'/><text x='270.0' y='98.0' font-size='11.5' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>Landmarks, one pass</text><text x='270.0' y='112.4' font-size='11.5' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>per frame</text><text x='270.0' y='128.8' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a pose detector with</text><text x='270.0' y='142.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>seven landmarks per</text><text x='270.0' y='156.1' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>body: the four corners</text><text x='270.0' y='169.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>exist today, three more</text><text x='270.0' y='183.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>to train</text><rect x='370.0' y='80.0' width='160.0' height='120.0' rx='4' stroke='#9a6f12' fill='#ffffff' class='paper' stroke-width='1.3' stroke-dasharray='2 3'/><text x='450.0' y='98.0' font-size='11.5' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>Lengths in pixels</text><text x='450.0' y='114.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>distances between</text><text x='450.0' y='128.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>landmarks, and from a</text><text x='450.0' y='141.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>landmark to a line</text><rect x='550.0' y='80.0' width='160.0' height='120.0' rx='4' stroke='#9a6f12' fill='#ffffff' class='paper' stroke-width='1.3' stroke-dasharray='2 3'/><text x='630.0' y='98.0' font-size='11.5' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>Millimetres</text><text x='630.0' y='114.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the detector's pixel</text><text x='630.0' y='128.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>spacing times the</text><text x='630.0' y='141.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>source-to-object over</text><text x='630.0' y='155.3' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the source-to-image</text><text x='630.0' y='169.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>distance, or a marker of</text><text x='630.0' y='182.6' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>known size</text><rect x='730.0' y='80.0' width='160.0' height='120.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='810.0' y='98.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>SchwingCheck</text><text x='810.0' y='114.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the posterior over</text><text x='810.0' y='128.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>places: median 13.6 ms,</text><text x='810.0' y='141.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>at most 17.4 ms, for a</text><text x='810.0' y='155.3' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>3-body field</text><line x1='172.0' y1='140.0' x2='188.0' y2='140.0' stroke='#9a6f12' stroke-width='1.4' stroke-dasharray='2 3' marker-end='url(#prop)'/><line x1='350.0' y1='140.0' x2='368.0' y2='140.0' stroke='#9a6f12' stroke-width='1.4' stroke-dasharray='2 3' marker-end='url(#prop)'/><line x1='530.0' y1='140.0' x2='548.0' y2='140.0' stroke='#9a6f12' stroke-width='1.4' stroke-dasharray='2 3' marker-end='url(#prop)'/><line x1='710.0' y1='140.0' x2='728.0' y2='140.0' stroke='#9a6f12' stroke-width='1.4' stroke-dasharray='2 3' marker-end='url(#prop)'/><line x1='890.0' y1='140.0' x2='908.0' y2='140.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><text x='912.0' y='120.0' font-size='10' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a name and its</text><text x='912.0' y='133.0' font-size='10' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>probability</text><text x='912.0' y='146.0' font-size='10' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>for each body,</text><text x='912.0' y='159.0' font-size='10' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>or "cannot</text><text x='912.0' y='172.0' font-size='10' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>say"</text><text x='190.0' y='240.0' font-size='12' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='bold' font-style='normal'>The road it replaces: SchwingCheck2D's step 2 as the white paper draws it</text><rect x='190.0' y='252.0' width='160.0' height='76.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='270.0' y='270.0' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>One mask per body</text><text x='270.0' y='285.8' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>FlexRay labels every</text><text x='270.0' y='298.8' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>pixel of every body on</text><text x='270.0' y='311.8' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>each panorama</text><line x1='350.0' y1='290.0' x2='368.0' y2='290.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='370.0' y='252.0' width='160.0' height='76.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='450.0' y='270.0' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Outlines</text><text x='450.0' y='285.8' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>each body's contour</text><text x='450.0' y='298.8' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>traced from its mask</text><line x1='530.0' y1='290.0' x2='548.0' y2='290.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='550.0' y='252.0' width='160.0' height='76.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='630.0' y='270.0' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Lengths off the</text><text x='630.0' y='283.8' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>outlines</text><text x='630.0' y='299.5' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>end plates, walls and</text><text x='630.0' y='312.5' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>canal found on the</text><text x='630.0' y='325.5' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>contour</text><text x='730.0' y='270.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>No time for this road on a C-arm frame is</text><text x='730.0' y='283.6' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>in any record read here. bordercall's</text><text x='730.0' y='297.3' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>handoff judges that the time goes to</text><text x='730.0' y='310.9' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>segmentation rather than to naming; that</text><text x='730.0' y='324.6' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>is the reason to try the road above.</text><text x='20.0' y='390.0' font-size='13' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Where the time goes, against one frame</text><text x='290.0' y='425.0' font-size='11' text-anchor='end' class='ink' fill='#1b1b1a' font-weight='normal' font-style='normal'>Four-corner detector, per image</text><rect x='300' y='412' width='40.8' height='18' fill='#2a5fa8'/><text x='348.8' y='425.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>6.8 ms (detect_v1; hardware not named)</text><text x='290.0' y='455.0' font-size='11' text-anchor='end' class='ink' fill='#1b1b1a' font-weight='normal' font-style='normal'>Three more landmarks</text><rect x='300' y='442' width='60' height='18' fill='none' stroke='#9a6f12' stroke-dasharray='2 3' stroke-width='1.3'/><text x='370.0' y='455.0' font-size='10.5' text-anchor='start' fill='#9a6f12' font-weight='normal' font-style='normal'>not built, not timed</text><text x='290.0' y='485.0' font-size='11' text-anchor='end' class='ink' fill='#1b1b1a' font-weight='normal' font-style='normal'>Pixels to millimetres</text><rect x='300' y='472' width='60' height='18' fill='none' stroke='#9a6f12' stroke-dasharray='2 3' stroke-width='1.3'/><text x='370.0' y='485.0' font-size='10.5' text-anchor='start' fill='#9a6f12' font-weight='normal' font-style='normal'>arithmetic, not timed</text><text x='290.0' y='515.0' font-size='11' text-anchor='end' class='ink' fill='#1b1b1a' font-weight='normal' font-style='normal'>SchwingCheck, 3 bodies</text><rect x='300' y='502' width='81.4' height='18' fill='#2a5fa8'/><line x1='381.4' y1='511.0' x2='404.3' y2='511.0' stroke='#2a5fa8' stroke-width='1.2'/><line x1='404.3' y1='505.0' x2='404.3' y2='517.0' stroke='#2a5fa8' stroke-width='1.2'/><text x='412.3' y='515.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>median 13.6 ms, max 17.4 ms (50 calls, 4 CPUs)</text><line x1='300.0' y1='404.0' x2='300.0' y2='532.0' class='stk2' stroke='#5c5b57' stroke-width='1'/><line x1='882.0' y1='400.0' x2='882.0' y2='536.0' class='stk' stroke='#1b1b1a' stroke-width='1.4' stroke-dasharray='5 3'/><text x='882.0' y='396.0' font-size='10.5' text-anchor='end' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>97 ms: one frame of C-ArmLSpine's 10.3 fps sweeps</text><text x='300.0' y='548.0' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>0</text><text x='450.0' y='548.0' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>25</text><text x='600.0' y='548.0' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>50</text><text x='750.0' y='548.0' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>75</text><text x='900.0' y='548.0' font-size='10' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>100</text><text x='600.0' y='564.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>milliseconds</text><text x='20.0' y='586.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>The bars come from different machines and are not one measured end-to-end time; the device's own time is unknown until it is built.</text><text x='20.0' y='624.0' font-size='13' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>What the device must reach for SchwingCheck's guarantee to hold</text><circle cx='28' cy='642.0' r='2.5' class='head' fill='#1b1b1a'/><text x='40.0' y='646.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Lengths as accurate as the generator assumes, 1 mm of noise. With 3 mm, names given at 0.99 from 3 bodies are right 82.6% under the nominal rule and 96.85%</text><text x='40.0' y='659.6' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>under the honest rule that widens its spreads.</text><circle cx='28' cy='673.3' r='2.5' class='head' fill='#1b1b1a'/><text x='40.0' y='677.3' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Today's corners: 76.8% within a tenth of the body's height and 91.7% within a fifth, on 558 test instances, mostly film; their error in millimetres is not</text><text x='40.0' y='690.9' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>measured.</text><circle cx='28' cy='704.6' r='2.5' class='head' fill='#1b1b1a'/><text x='40.0' y='708.6' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Both views where it can: from nine bodies AP alone names 89.1% exactly, lateral alone 83.6%, both 96.1% (synthetic).</text><circle cx='28' cy='722.2' r='2.5' class='head' fill='#1b1b1a'/><text x='40.0' y='726.2' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>A magnification error scales every length by one factor, as patient size does; whether the rule's size factor absorbs it has not been scored.</text></svg>
