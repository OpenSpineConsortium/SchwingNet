<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 752' width='1000' height='752' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img'><title>Three pathways</title><style>.ink{fill:#1b1b1a}.ink2{fill:#5c5b57}.stk{stroke:#1b1b1a}.stk2{stroke:#5c5b57}.learned{fill:#f2f1ed}.paper{fill:#ffffff}.head{fill:#1b1b1a}.rec{fill:#e4ecf7}@media (prefers-color-scheme: dark){.bg{fill:#151514}.ink{fill:#ecebe6}.ink2{fill:#b5b3ac}.stk{stroke:#ecebe6}.stk2{stroke:#b5b3ac}.learned{fill:#262624}.paper{fill:#1c1c1a}.head{fill:#ecebe6}.rec{fill:#1e2b40}}</style><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' class='head' fill='#1b1b1a'/></marker><marker id='dim' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2a5fa8'/></marker><marker id='prop' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#9a6f12'/></marker></defs><rect class='bg' width='1000' height='752' fill='#ffffff'/><text x='20.0' y='30.0' font-size='16' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Three pathways to a level label on the X-ray</text><text x='20.0' y='50.0' font-size='11.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>As the white paper lays them out: LevelCheck is prior art; SchwingCheck3D and SchwingCheck2D are its own. The heavy border marks where the level is decided.</text><text x='20.0' y='82.0' font-size='13.5' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>LevelCheck, prior art (US 11,284,846, listed to expire about 2034)</text><rect x='20.0' y='96.0' width='162.0' height='112.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3'/><text x='101.0' y='114.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>1  Label the CT</text><text x='101.0' y='130.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a clinician's click on</text><text x='101.0' y='144.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>each target vertebra:</text><text x='101.0' y='157.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the only classification</text><rect x='17' y='93' width='168' height='118' rx='6' fill='none' class='stk' stroke='#1b1b1a' stroke-width='2.6'/><line x1='182.0' y1='152.0' x2='202.0' y2='152.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='204.0' y='96.0' width='162.0' height='112.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='285.0' y='114.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>2  Segment the CT</text><text x='285.0' y='130.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the target vertebra in</text><text x='285.0' y='144.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the preoperative CT</text><line x1='366.0' y1='152.0' x2='386.0' y2='152.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='388.0' y='96.0' width='162.0' height='112.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='469.0' y='114.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>3  Line integrals</text><text x='469.0' y='130.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the X-ray converted to</text><text x='469.0' y='144.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>line integrals of</text><text x='469.0' y='157.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>attenuation</text><line x1='550.0' y1='152.0' x2='570.0' y2='152.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='572.0' y='96.0' width='162.0' height='112.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='653.0' y='114.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>4, 5  Pose and DRR</text><text x='653.0' y='130.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>render, compare by</text><text x='653.0' y='144.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>gradient information,</text><text x='653.0' y='157.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>update the pose, repeat</text><line x1='734.0' y1='152.0' x2='754.0' y2='152.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='756.0' y='96.0' width='162.0' height='112.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3'/><text x='837.0' y='114.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>6  Overlay</text><text x='837.0' y='130.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the final DRR and the</text><text x='837.0' y='144.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>CT's labels on the X-ray</text><text x='20.0' y='230.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Nothing checks step 1: a wrong CT label registers as well as a right one. LevelCheck matters here as proof that surgeons use a label overlay; in a mock</text><text x='20.0' y='244.3' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>operating room their median error fell from 30.4% to 2.4% with it (Manbachi et al. 2018).</text><text x='20.0' y='292.0' font-size='13.5' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>SchwingCheck3D, when a preoperative CT exists</text><rect x='20.0' y='306.0' width='162.0' height='112.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='101.0' y='324.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>1  Segment the CT</text><text x='101.0' y='340.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>one mask per vertebra</text><text x='101.0' y='354.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>from a CT instance</text><text x='101.0' y='367.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>segmenter</text><line x1='182.0' y1='362.0' x2='202.0' y2='362.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='204.0' y='306.0' width='162.0' height='112.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='285.0' y='324.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>2  Check the labels</text><text x='285.0' y='340.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>SchwingCheck reads the</text><text x='285.0' y='354.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>seven measures from the</text><text x='285.0' y='367.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>3D masks; a label it</text><text x='285.0' y='381.3' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>contradicts at 0.01 goes</text><text x='285.0' y='395.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>back to the radiologist</text><rect x='201' y='303' width='168' height='118' rx='6' fill='none' class='stk' stroke='#1b1b1a' stroke-width='2.6'/><line x1='366.0' y1='362.0' x2='386.0' y2='362.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='388.0' y='306.0' width='162.0' height='112.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='469.0' y='324.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>3  Panorama</text><text x='469.0' y='340.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>SchwingNet, with each</text><text x='469.0' y='354.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>C-arm pose tracked in</text><text x='469.0' y='367.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>world space</text><line x1='550.0' y1='362.0' x2='570.0' y2='362.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='572.0' y='306.0' width='162.0' height='112.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='653.0' y='324.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>4  Carry the labels</text><text x='653.0' y='340.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a pose fitted to matched</text><text x='653.0' y='354.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>vertebral centroids;</text><text x='653.0' y='367.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>SchwingCheck's posterior</text><text x='653.0' y='381.3' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>fused with each label</text><line x1='734.0' y1='362.0' x2='754.0' y2='362.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='756.0' y='306.0' width='162.0' height='112.0' rx='4' class='rec' fill='#e4ecf7' stroke='#2a5fa8' stroke-width='1.6'/><text x='837.0' y='324.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>A label with its</text><text x='837.0' y='338.4' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>probability</text><text x='837.0' y='354.8' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>on the X-ray</text><text x='20.0' y='440.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>The only pathway that checks the CT's labels before surgery; the centroid fit uses no DRR, no image similarity and no overlay of a rendered image.</text><text x='20.0' y='502.0' font-size='13.5' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>SchwingCheck2D, no CT: the default</text><rect x='20.0' y='516.0' width='162.0' height='112.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='101.0' y='534.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>1  Panoramas</text><text x='101.0' y='550.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>AP and lateral, from</text><text x='101.0' y='564.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>SchwingNet; both planes,</text><text x='101.0' y='577.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>since widths come from</text><text x='101.0' y='591.3' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the AP and depths from</text><text x='101.0' y='605.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the lateral</text><line x1='182.0' y1='572.0' x2='202.0' y2='572.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='204.0' y='516.0' width='162.0' height='112.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='285.0' y='534.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>2  One mask per body</text><text x='285.0' y='550.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>FlexRay on each</text><text x='285.0' y='564.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>panorama; or landmarks</text><text x='285.0' y='577.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>with no mask (figure</text><text x='285.0' y='591.3' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>36.5)</text><line x1='366.0' y1='572.0' x2='386.0' y2='572.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='388.0' y='516.0' width='162.0' height='112.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='469.0' y='534.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>3  Name or check</text><text x='469.0' y='550.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>SchwingCheck names the</text><text x='469.0' y='564.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>run from the bodies, or</text><text x='469.0' y='577.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>checks the names it is</text><text x='469.0' y='591.3' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>given</text><rect x='385' y='513' width='168' height='118' rx='6' fill='none' class='stk' stroke='#1b1b1a' stroke-width='2.6'/><line x1='550.0' y1='572.0' x2='570.0' y2='572.0' class='stk' stroke='#1b1b1a' stroke-width='1.3' marker-end='url(#arrow)'/><rect x='572.0' y='516.0' width='162.0' height='112.0' rx='4' class='rec' fill='#e4ecf7' stroke='#2a5fa8' stroke-width='1.6'/><text x='653.0' y='534.0' font-size='11.5' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>A name at 0.99</text><text x='653.0' y='550.4' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>otherwise the two or</text><text x='653.0' y='564.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>three likeliest levels,</text><text x='653.0' y='577.7' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>or "cannot say"</text><text x='20.0' y='650.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>No CT, no registration and no patent in the path. On the synthetic record its forced-choice error falls from 3.9% at nine bodies to 0.31% at fifteen, and</text><text x='20.0' y='664.3' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a panorama puts more bodies in view. The reader that takes the measures off radiographs is not built.</text><rect x='20.0' y='686.0' width='26.0' height='16.0' rx='4' class='learned stk' stroke='#1b1b1a' fill='#f2f1ed' stroke-width='1.3'/><text x='54.0' y='698.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>learned from data</text><rect x='190.6' y='686.0' width='26.0' height='16.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3' stroke-dasharray='5 3'/><text x='224.6' y='698.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>a rule: learns nothing</text><rect x='392.5' y='686.0' width='26.0' height='16.0' rx='4' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.3'/><text x='426.5' y='698.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>an input or an output</text><rect x='640' y='686' width='26' height='16' rx='4' class='rec' fill='#e4ecf7' stroke='#2a5fa8' stroke-width='1.6'/><text x='674.0' y='698.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the output the white paper recommends</text><text x='20.0' y='726.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Source: the white paper's section Three pathways (Inferred, a design); SchwingCheck's rates from bordercall's records (synthetic, no patient).</text></svg>
