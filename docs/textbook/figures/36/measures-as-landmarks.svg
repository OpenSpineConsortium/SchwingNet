<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 620' width='1000' height='620' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img'><title>Seven measures from landmarks</title><style>.ink{fill:#1b1b1a}.ink2{fill:#5c5b57}.stk{stroke:#1b1b1a}.stk2{stroke:#5c5b57}.learned{fill:#f2f1ed}.paper{fill:#ffffff}.head{fill:#1b1b1a}.rec{fill:#e4ecf7}@media (prefers-color-scheme: dark){.bg{fill:#151514}.ink{fill:#ecebe6}.ink2{fill:#b5b3ac}.stk{stroke:#ecebe6}.stk2{stroke:#b5b3ac}.learned{fill:#262624}.paper{fill:#1c1c1a}.head{fill:#ecebe6}.rec{fill:#1e2b40}}</style><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' class='head' fill='#1b1b1a'/></marker><marker id='dim' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2a5fa8'/></marker><marker id='prop' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#9a6f12'/></marker></defs><rect class='bg' width='1000' height='620' fill='#ffffff'/><text x='20.0' y='30.0' font-size='16' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>The seven measures as distances between landmarks, with no outline</text><text x='20.0' y='50.0' font-size='11.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Black dots: the four corners SchwingNet's body detector already finds. Ochre: landmarks no trained head finds yet. Blue: the lengths SchwingCheck reads.</text><text x='285.0' y='90.0' font-size='14' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>AP</text><polygon points='136.2,330.0 151.7,246.3 142.4,162.6 427.6,162.6 418.3,246.3 433.8,330.0' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.4'/><polygon points='142.4,224.6 61.8,218.4 61.8,190.5 142.4,184.3' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.0'/><ellipse cx='188.9' cy='206.0' rx='24.8' ry='32.6' class='stk' stroke='#1b1b1a' fill='none' stroke-width='1.0'/><polygon points='427.6,224.6 508.2,218.4 508.2,190.5 427.6,184.3' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.0'/><ellipse cx='381.1' cy='206.0' rx='24.8' ry='32.6' class='stk' stroke='#1b1b1a' fill='none' stroke-width='1.0'/><ellipse cx='285.0' cy='261.8' rx='17.1' ry='27.9' class='stk' stroke='#1b1b1a' fill='none' stroke-width='1.0'/><line x1='142.4' y1='158.6' x2='142.4' y2='122.6' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='427.6' y1='158.6' x2='427.6' y2='122.6' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='142.4' y1='130.6' x2='427.6' y2='130.6' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='285.0' y='122.6' font-size='11' text-anchor='middle' fill='#2a5fa8' font-weight='normal' font-style='normal'>upper end-plate width (1 to 2)</text><line x1='136.2' y1='334.0' x2='136.2' y2='370.0' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='433.8' y1='334.0' x2='433.8' y2='370.0' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='136.2' y1='362.0' x2='433.8' y2='362.0' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='285.0' y='382.0' font-size='11' text-anchor='middle' fill='#2a5fa8' font-weight='normal' font-style='normal'>lower end-plate width (3 to 4)</text><line x1='219.7' y1='206.0' x2='350.3' y2='206.0' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='285.0' y='196.0' font-size='10.5' text-anchor='middle' fill='#2a5fa8' font-weight='normal' font-style='normal'>canal width (5 to 6)</text><line x1='138.4' y1='162.6' x2='68.2' y2='162.6' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='132.2' y1='330.0' x2='68.2' y2='330.0' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='74.2' y1='162.6' x2='74.2' y2='330.0' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='66.2' y='240.3' font-size='10.5' text-anchor='end' fill='#2a5fa8' font-weight='normal' font-style='normal'>body</text><text x='66.2' y='252.9' font-size='10.5' text-anchor='end' fill='#2a5fa8' font-weight='normal' font-style='normal'>height</text><circle cx='142.4' cy='162.6' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='132.4' y='153.6' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>1</text><circle cx='427.6' cy='162.6' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='437.6' y='153.6' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>2</text><circle cx='136.2' cy='330.0' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='126.2' y='348.0' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>3</text><circle cx='433.8' cy='330.0' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='443.8' y='348.0' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>4</text><circle cx='213.7' cy='206.0' r='4.2' fill='#9a6f12' stroke='#ffffff' stroke-width='1'/><text x='213.7' y='224.0' font-size='11' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>5</text><circle cx='356.3' cy='206.0' r='4.2' fill='#9a6f12' stroke='#ffffff' stroke-width='1'/><text x='356.3' y='224.0' font-size='11' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>6</text><text x='700.0' y='90.0' font-size='14' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Lateral</text><polygon points='537.7,330.0 547.0,249.4 537.7,168.8 742.3,162.6 742.3,330.0' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.4'/><polygon points='742.3,184.3 826.0,187.4 826.0,233.9 742.3,237.0' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.0'/><polygon points='826.0,156.4 860.1,162.6 866.3,305.2 832.2,299.0' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.0'/><polygon points='864.4,206.0 968.6,271.1 959.3,295.9 865.7,261.8' class='paper stk' stroke='#1b1b1a' fill='#ffffff' stroke-width='1.0'/><line x1='537.7' y1='164.8' x2='537.7' y2='128.8' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='742.3' y1='158.6' x2='742.3' y2='122.6' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='537.7' y1='136.8' x2='742.3' y2='130.6' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='640.0' y='125.7' font-size='11' text-anchor='middle' fill='#2a5fa8' font-weight='normal' font-style='normal'>upper end-plate depth (1 to 2)</text><line x1='537.7' y1='334.0' x2='537.7' y2='370.0' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='742.3' y1='334.0' x2='742.3' y2='370.0' class='stk2' stroke='#5c5b57' stroke-width='0.7'/><line x1='537.7' y1='362.0' x2='742.3' y2='362.0' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='640.0' y='382.0' font-size='11' text-anchor='middle' fill='#2a5fa8' font-weight='normal' font-style='normal'>lower end-plate depth (4 to 3)</text><line x1='724.3' y1='168.6' x2='724.3' y2='324.0' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='716.3' y='232.3' font-size='10.5' text-anchor='end' fill='#2a5fa8' font-weight='normal' font-style='normal'>posterior</text><text x='716.3' y='244.9' font-size='10.5' text-anchor='end' fill='#2a5fa8' font-weight='normal' font-style='normal'>height</text><text x='716.3' y='257.5' font-size='10.5' text-anchor='end' fill='#2a5fa8' font-weight='normal' font-style='normal'>(2 to 3)</text><line x1='744.3' y1='264.9' x2='827.0' y2='264.9' stroke='#2a5fa8' stroke-width='1.4' marker-end='url(#dim)' marker-start='url(#dim)'/><text x='785.6' y='256.9' font-size='10.5' text-anchor='middle' fill='#2a5fa8' font-weight='normal' font-style='normal'>canal depth</text><text x='570.0' y='250.0' font-size='10.5' text-anchor='middle' class='ink2' fill='#5c5b57' font-weight='normal' font-style='italic'>front</text><circle cx='537.7' cy='168.8' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='527.7' y='159.8' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>1</text><circle cx='742.3' cy='162.6' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='752.3' y='153.6' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>2</text><circle cx='742.3' cy='330.0' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='752.3' y='348.0' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>3</text><circle cx='537.7' cy='330.0' r='4.2' fill='#1b1b1a' class='head' stroke='#ffffff' stroke-width='1'/><text x='527.7' y='348.0' font-size='11' text-anchor='middle' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>4</text><circle cx='831.0' cy='264.9' r='4.2' fill='#9a6f12' stroke='#ffffff' stroke-width='1'/><text x='843.0' y='268.9' font-size='11' text-anchor='middle' fill='#9a6f12' font-weight='bold' font-style='normal'>5</text><text x='30.0' y='470.0' font-size='11' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>AP, landmarks 1 to 4</text><text x='230.0' y='470.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the two ends of the upper and of the lower end plate: the corner detector's four slots, decoded for an AP view (chapter 12, figure 12.4)</text><text x='30.0' y='492.0' font-size='11' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>AP, landmarks 5 and 6</text><text x='230.0' y='492.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the medial borders of the two pedicles' rings, whose gap is the canal's width (the interpedicular distance)</text><text x='30.0' y='514.0' font-size='11' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Lateral, landmarks 1 to 4</text><text x='230.0' y='514.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the body's four corners, front and back, top and bottom</text><text x='30.0' y='536.0' font-size='11' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='bold' font-style='normal'>Lateral, landmark 5</text><text x='230.0' y='536.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>the spinolaminar point, the canal's back wall where the laminae meet; the canal depth runs from it to the line through 2 and 3</text><text x='30.0' y='570.0' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>Each view shows four of the seven: AP the two widths, the body's height and the canal width; lateral the two depths, the posterior height and the canal depth</text><text x='30.0' y='583.6' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>(bordercall bordercall/neighbour.py, which counts the height on both). Every length is a distance between two landmarks, or from a landmark to the line</text><text x='30.0' y='597.3' font-size='10.5' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal' font-style='normal'>through two others, so no mask and no outline is needed. The drawing follows bordercall's measures figure; the landmark scheme is a proposal (Inferred).</text></svg>
