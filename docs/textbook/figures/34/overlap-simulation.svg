dth='2' stroke-dasharray='5 3'/><text x='558.0' y='450.0' font-size='11' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='normal'>miss 2.4%, each link fails 2%</text><line x1='530' x2='552' y1='464' y2='464' stroke='#8a5cc2' stroke-width='2' stroke-dasharray='5 3'/><text x='558.0' y='468.0' font-size='11' text-anchor='start' class='ink' fill='#1b1b1a' font-weight='normal'>miss 2.4%, each link fails 4%</text><text x='20.0' y='500.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal'>Field 140 mm, pitch 34 mm lumbar and 27 mm thoracic, sacrum to T10, step jittered +/- 0.3 body; the in-frame</text><text x='20.0' y='516.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal'>rule, box repair and the robust pairing rule follow sweep_map.py. The image shift is taken as found exactly, so a</text><text x='20.0' y='532.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal'>link error enters only through the stated per-link rate. Miss rates: 2.4% on held-out film and 9.4% = 1 - 0.906</text><text x='20.0' y='548.0' font-size='11' text-anchor='start' class='ink2' fill='#5c5b57' font-weight='normal'>on a held-out C-arm, both records. 4000 simulated sweeps per point.</text></svg>
