name: gate
# beethoven-qa's definition of done on this repository's own package (docs/setup/beethoven-qa.md;
# beethoven-qa's docs/CONSUMING.md, step 5): the environment reconstructed from the lock alone,
# the pinned copy checked before anything it reports is believed, then each lane as its own step
# so a failure names itself. The kit's standards.yml runs the six code standards beside it. The
# job's name, gate, is a required check of docs/setup/ruleset-main.json beside check; rename
# both together. No job holds a secret and none reaches the grid.
#
# The symbolic lane is nearly all of the job's time, 31 of its 32 minutes on 2026-10-25, and on
# that day 76 of the 85 pull-request runs proved a package their pull request had not changed,
# about 1,480 minutes. From beethoven-qa 9.0.0 the gate, given a base commit, proves only the
# modules the change since that commit reaches: a module changed and every module that imports it,
# every module when pyproject.toml, pixi.toml, pixi.lock or the pinned copy under vendor/ changed,
# and none for a document, data, a test or a workflow (the pinned copy's src/beethoven_qa/scope.py
# gives the whole rule); the gate's other check still covers the whole package. So on a
# push or a pull request a step first asks GitHub, with the job's read-only token, for the newest
# commit of main this workflow passed on a push, and hands it to the lane as BEETHOVEN_QA_BASE; on
# a pull request the commit checked out is GitHub's test merge, so main's own changes since that
# commit are counted too. A commit that passed with a narrowed proof reads as the commit it was
# compared with, so the newest pass of either kind is a sound base. Where GitHub names no such
# commit, git cannot read it, or this file changed since it, the step gives no base and the lane
# proves every module, as it does once a day on main, in a concurrency group of its own so that a
# push cannot cancel it, since a new runner image, or the prover's own search within its time
# bound, may find what the last full run did not.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

env:
  # The pixi that produced the committed lock, fetched from its release asset by name and
  # checked against the sha256 the kit's standards.yml records for it.
  PIXI_VERSION: 0.81.0
  PIXI_SHA256: 248510f5f75460a2ae4ec62d761e15c0191dc35db3b1da6f82d9f17c6017051d

permissions:
  contents: read
  # to list this workflow's runs on main, for the commit the proof starts from
  actions: read

concurrency:
  # the daily full run in a group of its own, so a push to main cannot cancel it
  group: gate-${{ github.ref }}${{ github.event_name == 'schedule' && '-daily' || '' }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit the proof starts from is compared with this one by git
          fetch-depth: 0
          persist-credentials: false
      - name: install pixi
        env:
          PIXI_VERSION: ${{ env.PIXI_VERSION }}
          PIXI_SHA256: ${{ env.PIXI_SHA256 }}
        run: |
          curl -fsSL -o /tmp/pixi \
            "https://github.com/prefix-dev/pixi/releases/download/v${PIXI_VERSION}/pixi-x86_64-unknown-linux-musl"
          echo "${PIXI_SHA256}  /tmp/pixi" | sha256sum -c -
          install -m 0755 /tmp/pixi /usr/local/bin/pixi
          pixi --version
      - name: reconstruct the environment from the lock
        run: pixi install --locked
      - name: the pinned copy of beethoven-qa matches its ORIGIN, and the kit is in place
        run: pixi run --locked vendor-check
      - name: the interface standard's rules (boundary)
        run: pixi run --locked boundary
      - name: lint
        run: pixi run --locked lint
      - name: typecheck
        run: pixi run --locked typecheck
      - name: tests (typeguard enclave)
        run: pixi run --locked test
      - name: the commit the proof starts from
        id: base
        # A failure here leaves the output unset, and the proof then covers every module.
        continue-on-error: true
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          runs="repos/$REPO/actions/workflows/gate.yml/runs?branch=main&event=push&status=success"
          sha=$(gh api "$runs&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || sha=
          if [ -z "$sha" ]; then
            echo "the proof covers every module: GitHub names no commit of main this workflow passed on a push"
          elif ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "the proof covers every module: git cannot read $sha"
          elif ! git diff --quiet "$sha" HEAD -- .github/workflows/gate.yml; then
            echo "the proof covers every module: this workflow changed since $sha"
          else
            echo "base=$sha" >> "$GITHUB_OUTPUT"
            echo "the proof starts from $sha, the newest commit of main this workflow passed on a push"
          fi
      - name: symbolic verification (CrossHair and Z3)
        env:
          BEETHOVEN_QA_BASE: ${{ steps.base.outputs.base || 'none' }}
        run: pixi run --locked symbolic
      - name: shell syntax of the kit
        # One file per bash -n: with several operands bash parses the first and hands the rest
        # to it as arguments, so a syntax error in any later file went unseen.
        run: |
          for f in .githooks/pre-push .claude/hooks/beethoven-qa-session-start.sh; do bash -n "$f" || exit 1; done
