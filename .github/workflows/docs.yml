# The living documentation site (docs/learn/README.md): the lessons, the
# capabilities page, a reference made from the code's own docstrings and the
# test suite's results, built by tools/living_docs.py and published with
# GitHub Pages. The Artifact Textbook is built into the same site, under
# textbook/, by tools/textbook_site.py: a page for each chapter and each
# artifact, laid out from the artifacts and the synthesis's records (issue
# #196). The lessons' commands already ran in the required check before the
# merge; they run again here, so a page is published only from a commit whose
# examples still print what the pages say. The test report is written even
# when a test fails, so the Tests page shows the failure rather than hiding
# the page.
#
# It runs only when the owner starts it (Actions, Docs, Run workflow on the
# default branch), never on a push or a schedule: the owner's call of
# 2026-10-25, since a build on every merge and once a day spent Actions
# minutes on a site read far less often than it was rebuilt
# (OpenSpineConsortium/symphony-template's
# docs/research/actions-minutes-2026-10-25.md). What any merge brought, an
# auto-merged synthesis pull request's among it, reaches the site and the
# textbook at the owner's next run.
#
# Publishing needs two settings the workflow's token cannot make: Pages set
# to deploy from GitHub Actions, and the repository variable SYMPHONY_DOCS
# set to pages (docs/learn/README.md, Publishing the site). Until both are
# set the site is built and kept as an artifact, and nothing is deployed, so
# a copy that never turns Pages on sees no red run.
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # a deploy stopped halfway leaves Pages between two versions
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run every lesson's commands
        run: python3 tools/living_docs.py test

      - name: Clone symphony-protocol, as CI does, so the Tests page matches CI's run
        run: git clone --quiet https://github.com/OpenSpineConsortium/symphony-protocol "$RUNNER_TEMP/symphony-protocol"

      - name: Run the test suite for the Tests page
        continue-on-error: true
        env:
          SDLC_PROTOCOL: ${{ runner.temp }}/symphony-protocol
        run: python3 tools/living_docs.py report "$RUNNER_TEMP/tests.json"

      - name: The App's token to read spine-datasets' storage feed
        id: feed-token
        if: vars.SDLC_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: spine-datasets
          permission-contents: read

      # The textbook's storage panel (tools/storage_panel.py): the snapshot of the
      # feed is refreshed where the token reads it, and a feed that cannot be read is
      # one line in the log, never a failed deploy; the page is built either way.
      - name: Refresh the storage panel from the feed, else build it from the committed snapshot
        env:
          STORAGE_FEED_TOKEN: ${{ steps.feed-token.outputs.token }}
        run: |
          python3 tools/storage_panel.py fetch || echo "the storage panel is built from the committed snapshot"
          python3 tools/storage_panel.py build

      - name: Build the site
        env:
          SHA: ${{ github.sha }}
        run: python3 tools/living_docs.py site "$RUNNER_TEMP/site" --tests "$RUNNER_TEMP/tests.json" --repo "$GITHUB_REPOSITORY" --sha "$SHA"

      - name: Build the textbook into the site
        env:
          SHA: ${{ github.sha }}
        run: python3 tools/textbook_site.py "$RUNNER_TEMP/site/textbook" --repo "$GITHUB_REPOSITORY" --sha "$SHA"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: vars.SYMPHONY_DOCS == 'pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The site holds confidential work, the textbook's method chapters among
      # it, so it is deployed only while GitHub says the Pages site is private:
      # a site turned public, or an answer that cannot be read, stops the deploy
      # (docs/project.md: nothing public before the provisional is filed).
      - name: Deploy only to a private site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.public' || true)"
          if [ "$public" != "false" ]; then
            echo "::error::GitHub does not report this repository's Pages site as private (public: ${public:-not read}), so nothing is deployed"
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v5
