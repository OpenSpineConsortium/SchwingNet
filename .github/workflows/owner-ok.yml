name: Owner OK

# The owner's own tap on each pull request before it merges, in place of
# an approving review, which GitHub never lets the owner give on a pull
# request opened under the owner's own login, as every session's is. The
# job deploys to the environment owner-ok, whose required reviewer is the
# owner, so it waits until the owner presses Approve or Reject, which
# GitHub Mobile offers on the push notification it sends; the job's check
# run, named owner-ok, is what a ruleset requires (docs/setup/github.md,
# section 10). It does nothing else: no checkout, no token, no secret.
#
# A draft starts no deployment, so a worker's pushes to its draft ping no
# one; GitHub reads the skipped run as passing, and a draft cannot merge
# anyway. Marking it ready, and every push after, starts a new run, so the
# tap always covers the head that merges, and a newer push cancels a run
# still waiting, so only one request is ever pending per pull request. An
# environment the owner has not set up yet is made by the first run with
# no reviewer and passes at once: the gate holds only once the owner has
# named a reviewer on it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: owner-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner-ok:
    name: owner-ok
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: owner-ok
    steps:
      - name: The owner approved this head
        run: echo "owner-ok for ${{ github.event.pull_request.head.sha }}"
