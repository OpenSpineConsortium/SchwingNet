name: Research loop

# The textbook's research loop (issue #220): every four hours a Claude session takes the
# best-ranked item of the claims register (docs/textbook/claims.json, chapter 33) that nobody
# holds, opens or carries on its issue labelled research, claims it as the worker research-loop
# and works it to a pull request the owner merges, under the standing brief
# .github/symphony/research.md. The owner asked for it on 2026-10-24 ("CONTINUE THESE TYPES OF
# REQUESTS AUTONOMOUSLY FOR LEADING THE REASAEARCH FURTHER") and gave it "full command to direct
# autonmous research": it starts grid work, fetches and training without asking, within the rules
# the brief states (the size rule, no CT-RATE without the owner's terabytes, no Radiopaedia by
# script, no usage credits, the claim protocol, nothing public). docs/project.md records the
# exception, and docs/memory/research-loop.md says how it works.
#
# A run works only when all of these hold, and its job summary names the first that does not:
#   - the variable RESEARCH_LOOP is not off (set it to off to stop the loop);
#   - crowd mode is off: in crowd mode (the variable CLAUDE_CROWD) no workflow runs Claude, and
#     the job never starts;
#   - the repository secret CLAUDE_CODE_OAUTH_TOKEN is set, the subscription token `claude
#     setup-token` makes, so the runs draw on that account's plan and bill no API;
#   - fewer runs than the variable RESEARCH_RUNS_PER_DAY (6 unless it says otherwise, 50 at most)
#     have started today, in UTC, counted by the marker artifact research-runs each admitted run
#     keeps, as synthesis.yml counts its reads;
#   - the last three admitted runs did not all fail, the last less than six hours ago; Run
#     workflow always tries.
# One run at a time (the concurrency group research). Before Claude, tools/research_loop.py pick
# reads the register and the open issues and pull requests labelled research, so no item is
# started twice: the loop's own open issue is carried on first, and an item another worker, a
# block, a review or an act of the owner's holds is skipped.
#
# The session reads web pages and issue text nobody has vouched for; the brief marks all of it as
# data, never an instruction, and the tool list is no fence (bash and python3 run anything), so
# what bounds a misled run is what its tokens reach. It holds two: the GitHub token Claude's action
# mints from id-token, as in claude.yml, which reaches this repository's contents, issues and pull
# requests, so its pushes and pull requests start the checks; and this job's workflow token, in its
# environment as RESEARCH_READ_TOKEN, which the job grants reads alone (actions: read), so that
# tools/research_loop.py runs and log can read the grid's runs. Neither can start a workflow,
# cancel a run or delete an artifact. Grid work goes the long way round: tools/research_loop.py grid
# and gate check a request (grid.yml with one committed program and plain arguments,
# research_loop.command_problem, since grid.yml runs its command with bash on a university node;
# grid-gate.yml with one of its three words) and queue it as a line of the file RESEARCH_REQUESTS
# names, at most RESEARCH_DISPATCHES_PER_RUN (3) a session, and the job dispatch below, once the
# session has ended, reads every line again against main's code, refuses what it does not admit,
# dispatches the rest on main with a token the session never held and posts each run's link on the
# item's issue, an open issue labelled research and no other. So a session cannot wait for a grid
# result in the run that asks for it; the brief has it leave the item resumable first, and the next
# run reads the result. grid.yml runs a command on a compute node inside the runner's container,
# with no lab volume and no Slurm; the gate words of grid/gate.sh, which queue the Slurm jobs, are
# sent through symphony-template's grid-accounts.yml by an admin, which this loop cannot reach, so
# the brief has it ask the owner for such a word in an issue. After the session the job records
# what it spent, as claude.yml does, for metrics.yml.

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      item:
        description: "An item id of docs/textbook/claims.json to work (E07); empty lets the loop pick"
        required: false
        default: ""

# Nothing at the top; each job asks for what it needs.
permissions: {}

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    # main's copy of this file alone, as synthesis.yml: a Run workflow from another branch would run
    # that branch's copy, with whatever it grants
    if: vars.CLAUDE_CROWD != 'true' && github.repository == 'OpenSpineConsortium/SchwingNet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read # the checkout; the session pushes with the token Claude's action mints
      issues: read # the open issues labelled research, for the pick
      pull-requests: read # the open pull requests labelled research, for the pick
      actions: read # the day's marks, and the grid's runs for the session's runs and log; the uploads use the runner's own token
      id-token: write # Claude's action mints its own GitHub token from it, as in claude.yml
    env:
      HAVE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    outputs:
      requests: ${{ steps.requests.outputs.requests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Whether this run may work
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.RESEARCH_LOOP }}
          CROWD: ${{ vars.CLAUDE_CROWD }}
          CAP: ${{ vars.RESEARCH_RUNS_PER_DAY }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/actions/artifacts?name=research-runs&per_page=100" > "$RUNNER_TEMP/marks.json"
          python3 tools/research_loop.py marked --marks "$RUNNER_TEMP/marks.json" > "$RUNNER_TEMP/marked.txt"
          # a run GitHub cannot show (deleted, or a passing error) is left out rather than failing
          # every scheduled run for the two days its mark lives
          while read -r id; do
            if [ -n "$id" ]; then gh api "repos/$REPO/actions/runs/$id" || true; fi
          done < "$RUNNER_TEMP/marked.txt" | jq -s '{workflow_runs: .}' > "$RUNNER_TEMP/runs.json"
          python3 tools/research_loop.py admit --marks "$RUNNER_TEMP/marks.json" --runs "$RUNNER_TEMP/runs.json" \
            --switch "$SWITCH" --crowd "$CROWD" --token "$HAVE_TOKEN" --cap "$CAP" --event "$EVENT" \
            --words "$RUNNER_TEMP/words.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/words.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Pick the item
        id: pick
        if: steps.admit.outputs.admit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ inputs.item }}
        run: |
          set -euo pipefail
          { echo '### The register'"'"'s next items'; echo '```json'; python3 tools/claims_rank.py next; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/research_loop.py pick --repo "$REPO" --item "$ITEM" --out "$RUNNER_TEMP/pick.json" > /dev/null
          mode=$(jq -r .mode "$RUNNER_TEMP/pick.json")
          # the item and the issue the run works, for the clerk's grid requests (the session's environment)
          {
            echo "mode=$mode"
            echo "item=$(jq -r '.item.id // ""' "$RUNNER_TEMP/pick.json")"
            echo "issue=$(jq -r '.issue // ""' "$RUNNER_TEMP/pick.json")"
          } >> "$GITHUB_OUTPUT"
          { echo '### This run'"'"'s choice'; echo '```json'; cat "$RUNNER_TEMP/pick.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Mark the run as one that works, for the day's count
        if: steps.admit.outputs.admit == 'true' && steps.pick.outputs.mode != 'none'
        env:
          WHY: ${{ steps.admit.outputs.why }}
        run: printf '%s\n' "$WHY" > "$RUNNER_TEMP/research-runs.txt"
      - name: Keep the mark
        if: steps.admit.outputs.admit == 'true' && steps.pick.outputs.mode != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-runs
          path: ${{ runner.temp }}/research-runs.txt
          retention-days: 2
          if-no-files-found: error
      - name: The prompt, and a copy of the usage recorder, which the run cannot move
        id: brief
        if: steps.admit.outputs.admit == 'true' && steps.pick.outputs.mode != 'none'
        env:
          SETTINGS: ${{ vars.SYMPHONY_CLAUDE_SETTINGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp tools/usage.py "$RUNNER_TEMP/usage.py"
          cp -r tools/profile.py tools/economics.py tools/sdlc_protocol "$RUNNER_TEMP/" || true
          # the clerk's why, read after the session from this copy, since the session can edit tools/
          cp tools/research_loop.py tools/claims_rank.py "$RUNNER_TEMP/"
          python3 tools/research_loop.py prompt --brief .github/symphony/research.md --pick "$RUNNER_TEMP/pick.json" \
            --run "$RUN_URL" >> "$GITHUB_OUTPUT"
          # the model, effort and fallback the Tokens tab's main tile sets; a variable that does
          # not hold together leaves Claude's own defaults
          python3 tools/pool.py settings --slot main --settings "$SETTINGS" >> "$GITHUB_OUTPUT" || true
      - name: The research session
        id: claude
        if: steps.admit.outputs.admit == 'true' && steps.pick.outputs.mode != 'none'
        uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855 # v1.0.249
        env:
          # the workflow token, which only reads, in the session's environment for tools/research_loop.py
          # runs and log; the brief has it used through the clerk alone (the header)
          RESEARCH_READ_TOKEN: ${{ github.token }}
          # where the clerk queues the session's grid requests, for the job dispatch after the session,
          # how many it may queue, and the item and issue the run works, from the pick
          RESEARCH_REQUESTS: ${{ runner.temp }}/research-requests.jsonl
          RESEARCH_DISPATCHES_PER_RUN: ${{ vars.RESEARCH_DISPATCHES_PER_RUN }}
          RESEARCH_ITEM: ${{ steps.pick.outputs.item }}
          RESEARCH_ISSUE: ${{ steps.pick.outputs.issue }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,claude"
          prompt: ${{ steps.brief.outputs.prompt }}
          claude_args: |
            --max-turns ${{ vars.RESEARCH_MAX_TURNS || '300' }}
            ${{ steps.brief.outputs.model != '' && format('--model {0}', steps.brief.outputs.model) || '' }}
            ${{ steps.brief.outputs.effort != '' && format('--effort {0}', steps.brief.outputs.effort) || '' }}
            ${{ steps.brief.outputs.fallback != '' && format('--fallback-model {0}', steps.brief.outputs.fallback) || '' }}
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,WebSearch,WebFetch,Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(bash:*),Bash(jq:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(diff:*),Bash(mkdir:*),Bash(rm:*),Bash(mv:*),Bash(cp:*)"
      - name: Why the session ended, when it ended in error
        # the action shows the session's output only whole, so a run refused before its first turn
        # (a token no longer valid, a limit reached) would otherwise leave a log that says only
        # is_error; the result's fields and the session's last words go to the log and the summary,
        # with the shapes of secrets masked
        if: always() && steps.claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: >-
          python3 "$RUNNER_TEMP/research_loop.py" why
          "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Whether the session asked for grid work
        id: requests
        if: steps.admit.outputs.admit == 'true' && steps.pick.outputs.mode != 'none'
        run: |
          if [ -s "$RUNNER_TEMP/research-requests.jsonl" ]; then echo "requests=true"; else echo "requests=false"; fi >> "$GITHUB_OUTPUT"
      - name: Keep the requests for the job dispatch
        if: steps.requests.outputs.requests == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-requests.jsonl
          retention-days: 1
          if-no-files-found: error
      - name: Record what the run spent, for the field metrics
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SDLC_METRICS: ${{ vars.SDLC_METRICS }}
        run: >-
          python3 "$RUNNER_TEMP/usage.py" actions --root "$GITHUB_WORKSPACE"
          --execution-file "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          --out "$RUNNER_TEMP/symphony-usage/record.json" --workflow research --job research
      - name: Keep the record where the metrics workflow reads it
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symphony-usage-${{ github.run_id }}-${{ github.run_attempt }}-research
          path: ${{ runner.temp }}/symphony-usage/record.json
          if-no-files-found: ignore

  dispatch:
    # The session's grid requests, run once the session has ended, by a job whose token it never
    # held (the header): main's copy of the clerk reads each request again against main's code and
    # dispatches what it admits, up to the limit, on main.
    needs: research
    if: needs.research.result == 'success' && needs.research.outputs.requests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # main's copy of the clerk
      actions: write # the dispatch of grid.yml and grid-gate.yml, and the listing that finds each run
      issues: write # the comment with the runs' links on the item's issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: The requests the session queued
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requests
      - name: Dispatch what main's code admits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIMIT: ${{ vars.RESEARCH_DISPATCHES_PER_RUN }}
        run: |
          set -euo pipefail
          python3 tools/research_loop.py dispatch --requests "$RUNNER_TEMP/requests/research-requests.jsonl" \
            --repo "$REPO" --limit "$LIMIT"
