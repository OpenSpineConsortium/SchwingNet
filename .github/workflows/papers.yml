name: Papers

# Queues the review comments of the Word documents a push brings to the
# default branch: each document is one task for good, opened the first
# time it has open comments and told of each new one after, reopened or
# queued again as needed (tools/docx_review.py watch,
# docs/setup/word-revisions.md). Claude's own comments, the answers a
# worker writes, queue nothing. A push GITHUB_TOKEN makes starts no
# workflow, so the drive sync queues what its own merges bring at its next
# run instead; this workflow covers the rest, a person's push or a merge
# by hand or by a worker. An issue GITHUB_TOKEN labels starts no workflow
# either, so the run wakes the workers itself. Where a drive is connected,
# it also starts the drive sync, so a merged revision reaches the drive
# straight away.

on:
  push:
    paths: ["**/*.docx"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

# One group with drive-sync.yml, since both open and tell the documents' tasks.
concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  queue:
    if: github.event.repository.fork == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Queue the new comments of the documents this push changed
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff -z --name-only --diff-filter=AMR "$BEFORE" HEAD -- '*.docx' > "$RUNNER_TEMP/changed"
          else
            git ls-files -z -- '*.docx' > "$RUNNER_TEMP/changed"
          fi
          if [ ! -s "$RUNNER_TEMP/changed" ]; then
            echo "no document changed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          xargs -0 python3 tools/docx_review.py watch -- < "$RUNNER_TEMP/changed" > "$RUNNER_TEMP/queued.txt"
          if [ -s "$RUNNER_TEMP/queued.txt" ]; then
            echo "queued: $(tr '\n' ' ' < "$RUNNER_TEMP/queued.txt")" >> "$GITHUB_STEP_SUMMARY"
            gh workflow run workers.yml --repo "$REPO" || echo "could not wake the workers" >> "$GITHUB_STEP_SUMMARY"
          fi

      # A merge that changes a tracked document sends it up to the drive at
      # once, rather than at the next half-hourly sync; a dispatch with
      # GITHUB_TOKEN does start a workflow, where a push with it would not.
      - name: Send the documents up to the connected drive now
        if: always() && hashFiles('.github/symphony/drive.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run drive-sync.yml --repo "$REPO" ||
            echo "could not start the drive sync; the half-hourly run sends them up" >> "$GITHUB_STEP_SUMMARY"
