<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FluoroCap Adjudication Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0a0d10; --panel:#131a20; --panel2:#0f161b; --line:#24313a; --rule:#1a242b;
  --ink:#e6edf2; --muted:#93a4b1; --faint:#6b7d8a;
  --accent:#4ea3d6; --ok:#4fae7e; --near:#d3a04f; --bad:#d4695f; --unsure:#8796a2;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;
     padding-inline:16px;padding-block:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 60px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
       border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:60ch}
.counts{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.counts b{color:var(--ink);font-weight:600}

.bar{height:3px;background:var(--rule);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:22px;margin-top:20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}

.viewer{background:#000;border:1px solid var(--line);position:relative;display:grid;place-items:center;
        min-height:400px;overflow:hidden}
.viewer img{max-width:100%;max-height:74vh;display:block;transition:transform .18s;cursor:zoom-in;
            image-rendering:auto}
.viewer img.zoom{transform:scale(2);cursor:zoom-out}
.vtools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.vtools button{font-family:var(--mono);font-size:11px;background:rgba(12,18,22,.85);color:var(--muted);
               border:1px solid var(--line);padding:5px 8px;cursor:pointer}
.vtools button:hover{color:var(--ink);border-color:var(--accent)}
.vtools button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 15px}
.card h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:600}
.levels{display:flex;flex-wrap:wrap;gap:6px}
.lv{font-family:var(--mono);font-size:13px;border:1px solid var(--line);padding:4px 8px;background:var(--panel2);
    display:flex;gap:7px;align-items:baseline}
.lv i{font-style:normal;color:var(--faint);font-size:10.5px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.meta b{color:var(--faint);font-weight:500}

.capbox{border:1px dashed var(--line);padding:11px 12px;background:var(--panel2)}
.capbox p{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--ink);word-break:break-word}
.capbox .warn{color:var(--near);font-size:11.5px;font-family:var(--ui);margin-top:8px}
button.reveal{font-family:var(--ui);font-size:13px;background:transparent;color:var(--accent);border:1px solid var(--line);
              padding:7px 11px;cursor:pointer;width:100%}
button.reveal:hover{border-color:var(--accent)}

.verdicts{display:grid;gap:7px}
.verdicts button{font-family:var(--ui);font-size:14px;text-align:left;padding:10px 12px;cursor:pointer;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.verdicts button kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);padding:1px 5px}
.verdicts button:hover{border-color:var(--accent)}
.verdicts button[data-v="correct"]{border-left:3px solid var(--ok)}
.verdicts button[data-v="off_by_one"]{border-left:3px solid var(--near)}
.verdicts button[data-v="wrong"]{border-left:3px solid var(--bad)}
.verdicts button[data-v="unsure"]{border-left:3px solid var(--unsure)}
.verdicts button[data-v="not_a_spine_radiograph"]{border-left:3px solid var(--faint)}
.verdicts button.sel{background:#1b2730;border-color:var(--accent)}

input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
                 font-family:var(--mono);font-size:13px;padding:8px 10px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
label.fl{display:block;font-size:11.5px;color:var(--faint);margin:0 0 5px;letter-spacing:.04em}

.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:2px}
.nav button{font-family:var(--ui);font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
            padding:8px 14px;cursor:pointer}
.nav button:hover{border-color:var(--accent)}
.nav .pos{font-family:var(--mono);font-size:12px;color:var(--muted)}

.status{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.status .dot.on{background:var(--ok)} .status .dot.off{background:var(--near)}

.grid-jump{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.grid-jump b{width:19px;height:19px;font-family:var(--mono);font-size:9.5px;display:grid;place-items:center;
             background:var(--panel2);border:1px solid var(--rule);color:var(--faint);cursor:pointer;font-weight:400}
.grid-jump b.done{background:#1c2a24;border-color:#2d4a3c;color:var(--ok)}
.grid-jump b.cur{border-color:var(--accent);color:var(--accent)}
</style>

<div class="wrap">
<header>
  <div>
    <h1>FluoroCap Adjudication Bench</h1>
    <p class="sub">120 panels drawn stratified across deciding evidence and spinal region. Read the film first,
    then reveal the caption only if you need it. Whether you revealed it is recorded.</p>
  </div>
  <div class="counts" id="counts"></div>
</header>
<div class="bar"><i id="bar"></i></div>

<main>
  <div class="viewer" id="viewer">
    <img id="img" alt="spine radiograph panel">
    <div class="vtools">
      <button id="invert" aria-pressed="false">invert</button>
      <button id="bright" aria-pressed="false">boost</button>
      <button id="zoomb">zoom</button>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h2>What the pipeline decided</h2>
      <div class="levels" id="levels"></div>
      <div class="meta" id="meta" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>Caption</h2>
      <div id="capwrap"></div>
    </div>

    <div class="card">
      <h2>Your read</h2>
      <div class="verdicts" id="verdicts">
        <button data-v="correct">Levels are correct <kbd>1</kbd></button>
        <button data-v="off_by_one">Off by one level <kbd>2</kbd></button>
        <button data-v="wrong">Wrong, more than one off <kbd>3</kbd></button>
        <button data-v="unsure">Cannot tell from this image <kbd>4</kbd></button>
        <button data-v="not_a_spine_radiograph">Not a spine radiograph <kbd>0</kbd></button>
      </div>
      <div style="margin-top:12px">
        <label class="fl" for="corr">Correct levels, if you can name them</label>
        <input type="text" id="corr" placeholder="e.g. L4 L5 sacrum" autocomplete="off">
      </div>
      <div style="margin-top:10px">
        <label class="fl" for="note">Note</label>
        <input type="text" id="note" placeholder="hardware obscures L5, oblique projection, ..." autocomplete="off">
      </div>
      <div class="nav">
        <button id="prev">&larr; Back</button>
        <span class="pos" id="pos"></span>
        <button id="next">Next &rarr;</button>
      </div>
    </div>

    <div class="status">
      <span id="dbstate"><span class="dot"></span>connecting</span>
      <div class="grid-jump" id="jump"></div>
    </div>
  </div>
</main>
</div>

<script>
(function(){
  const MAN = JSON.parse(document.getElementById("manifest").textContent);
  const ITEMS = MAN.items;
  const $ = id => document.getElementById(id);
  let i = 0, db = null, reads = {};

  function lsGet(){ try{ return JSON.parse(localStorage.getItem("fluorocap_reads")||"{}"); }catch(e){ return {}; } }
  function lsSet(o){ try{ localStorage.setItem("fluorocap_reads", JSON.stringify(o)); }catch(e){} }

  async function boot(){
    reads = lsGet();
    render();
    try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
    if(db){
      $("dbstate").innerHTML = '<span class="dot on"></span>saving to the shared record';
      try{
        const snap = await db.collection("reads").limit(500).get();
        (snap || []).forEach(d => { const v = d.data ? d.data() : d; if(v && v.image_id) reads[v.image_id] = v; });
        lsSet(reads);
      }catch(e){}
      render();
    } else {
      $("dbstate").innerHTML = '<span class="dot off"></span>saving in this browser only';
    }
  }

  function render(){
    const it = ITEMS[i];
    $("img").src = it.image;
    $("img").classList.remove("zoom");
    const lv = $("levels"); lv.textContent = "";
    (it.decoded_levels||[]).forEach((L,k)=>{
      const d = document.createElement("span"); d.className = "lv";
      const c = it.confidence && it.confidence[k] !== undefined ? it.confidence[k] : null;
      d.innerHTML = '<span>'+L+'</span>' + (c!==null ? '<i>'+c.toFixed(2)+'</i>' : '');
      lv.appendChild(d);
    });
    const m = $("meta"); m.textContent = "";
    const rows = [
      ["decided by", it.decided_by || "nothing"],
      ["boxes", it.n_boxes],
      ["order reversed", it.reversed ? "yes" : "no"],
      ["caption forced", it.hard_caption ? "yes" : "no"],
      ["region drawn", it.stratum.region],
      ["id", it.image_id]
    ];
    rows.forEach(([a,b])=>{ const x=document.createElement("b"); x.textContent=a; const y=document.createElement("span"); y.textContent=String(b); m.append(x,y); });

    const cw = $("capwrap"); cw.textContent = "";
    const r = reads[it.image_id] || {};
    if(!it.caption_levels){
      const p = document.createElement("div"); p.className="capbox";
      p.innerHTML = '<p style="color:var(--faint)">This panel has no caption naming a level. Your read is the only ground truth it will ever have.</p>';
      cw.appendChild(p);
    } else if(r.saw_caption){
      const p = document.createElement("div"); p.className="capbox";
      p.innerHTML = '<p>'+String(it.caption_levels).replace(/[<>&]/g,s=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[s]))+'</p>'+
                    '<div class="warn">Recorded: you read this one with the caption.</div>';
      cw.appendChild(p);
    } else {
      const b = document.createElement("button"); b.className="reveal"; b.textContent="Reveal the caption's levels";
      b.onclick = ()=>{ save({saw_caption:true}); render(); };
      cw.appendChild(b);
    }

    document.querySelectorAll("#verdicts button").forEach(b=>{
      b.classList.toggle("sel", r.verdict === b.dataset.v);
    });
    $("corr").value = r.correct_levels || "";
    $("note").value = r.note || "";
    $("pos").textContent = (i+1) + " / " + ITEMS.length;

    const done = Object.values(reads).filter(v=>v && v.verdict).length;
    const tally = {};
    Object.values(reads).forEach(v=>{ if(v&&v.verdict) tally[v.verdict]=(tally[v.verdict]||0)+1; });
    $("counts").innerHTML = '<span>read <b>'+done+'</b> of '+ITEMS.length+'</span>' +
      Object.entries(tally).map(([k,v])=>'<span>'+k.replace(/_/g," ")+' <b>'+v+'</b></span>').join("");
    $("bar").style.width = (100*done/ITEMS.length).toFixed(1)+"%";

    const j = $("jump"); j.textContent="";
    ITEMS.forEach((t,k)=>{
      const b=document.createElement("b"); b.textContent=k+1;
      if(reads[t.image_id] && reads[t.image_id].verdict) b.classList.add("done");
      if(k===i) b.classList.add("cur");
      b.onclick=()=>{ i=k; render(); };
      j.appendChild(b);
    });
  }

  function save(patch){
    const it = ITEMS[i];
    const prev = reads[it.image_id] || {};
    const rec = Object.assign({
      image_id: it.image_id, panel_path: it.panel_path,
      decoded_levels: it.decoded_levels, decided_by: it.decided_by,
      stratum: it.stratum, has_caption: !!it.caption_levels,
      saw_caption: false
    }, prev, patch, {updated: new Date().toISOString()});
    reads[it.image_id] = rec;
    lsSet(reads);
    if(db){ try{ db.doc("reads/"+it.image_id).set(rec); }catch(e){} }
  }

  document.querySelectorAll("#verdicts button").forEach(b=>{
    b.onclick = ()=>{ save({verdict:b.dataset.v}); render(); setTimeout(()=>{ if(i<ITEMS.length-1){ i++; render(); } }, 160); };
  });
  $("corr").onchange = e => save({correct_levels:e.target.value.trim()});
  $("note").onchange = e => save({note:e.target.value.trim()});
  $("prev").onclick = ()=>{ if(i>0){ i--; render(); } };
  $("next").onclick = ()=>{ if(i<ITEMS.length-1){ i++; render(); } };
  $("img").onclick = ()=> $("img").classList.toggle("zoom");
  $("zoomb").onclick = ()=> $("img").classList.toggle("zoom");
  $("invert").onclick = e =>{ const on = e.target.getAttribute("aria-pressed")!=="true";
    e.target.setAttribute("aria-pressed", on); applyFilter(); };
  $("bright").onclick = e =>{ const on = e.target.getAttribute("aria-pressed")!=="true";
    e.target.setAttribute("aria-pressed", on); applyFilter(); };
  function applyFilter(){
    const inv = $("invert").getAttribute("aria-pressed")==="true";
    const br = $("bright").getAttribute("aria-pressed")==="true";
    $("img").style.filter = (inv?"invert(1) ":"") + (br?"contrast(1.5) brightness(1.15)":"");
  }
  document.addEventListener("keydown", e=>{
    if(e.target.tagName === "INPUT") return;
    const map = {"1":"correct","2":"off_by_one","3":"wrong","4":"unsure","0":"not_a_spine_radiograph"};
    if(map[e.key]){ save({verdict:map[e.key]}); render(); if(i<ITEMS.length-1){ setTimeout(()=>{i++;render();},160); } }
    else if(e.key==="ArrowRight"){ if(i<ITEMS.length-1){ i++; render(); } }
    else if(e.key==="ArrowLeft"){ if(i>0){ i--; render(); } }
    else if(e.key==="c"){ if(ITEMS[i].caption_levels){ save({saw_caption:true}); render(); } }
  });
  boot();
})();
</script>

</body></html>
